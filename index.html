// The dominant hue of an emoji, read from the pixels it draws (cached). Null for a grey or plain one.
const _emojiHue = new Map();
function emojiHue(emoji){
  if(_emojiHue.has(emoji)) return _emojiHue.get(emoji);
  let hue=null;
  try{
    const c=document.createElement("canvas"); c.width=c.height=48;
    const x=c.getContext("2d",{willReadFrequently:true});
    x.font="36px 'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif"; x.textAlign="center"; x.textBaseline="middle"; x.fillText(emoji,24,26);
    const d=x.getImageData(0,0,48,48).data; let sx=0,sy=0,w=0;
    for(let i=0;i<d.length;i+=4){
      if(d[i+3]<160) continue;
      const r=d[i]/255,g=d[i+1]/255,b=d[i+2]/255, mx=Math.max(r,g,b), ch=mx-Math.min(r,g,b);
      if(ch<.18||mx<.2) continue;                                   // skip greys and near-black
      const h=((mx===r?((g-b)/ch+6)%6:mx===g?(b-r)/ch+2:(r-g)/ch+4)*60)*Math.PI/180;
      sx+=Math.cos(h)*ch; sy+=Math.sin(h)*ch; w+=ch;                // weight by how colourful the pixel is
    }
    if(w>3) hue=((Math.atan2(sy,sx)*180/Math.PI)+360)%360;
  }catch{}
  _emojiHue.set(emoji,hue); return hue;
}

// What is left of today's review: new words (up to the daily cap), plus answers got wrong that still need a right one.
const reviewLeft = (phrases,day) => {
  const seen=new Set(day.seen), byId=new Map(phrases.map(p=>[p.id,p]));
  const cap=Math.max(0,REVIEW_DAILY-seen.size), pool=phrases.filter(p=>isDue(p)&&!seen.has(p.id));
  const retry=day.right<REVIEW_RIGHT?day.wrong.map(id=>byId.get(id)).filter(Boolean):[];
  const finished=seen.size>=REVIEW_DAILY&&day.right>=REVIEW_RIGHT;
  return { pool, cap, retry, count:finished?0:Math.min(pool.length,cap)+retry.length };
};
// After one answer: update the day's tallies, queue a wrong answer to be asked again, and say what comes next.
// It ends once 10 words are done and 5 are right, or when there is nothing left to ask.
const reviewAfter = (day,deck,index,rating) => {
  const p=deck[index], right=rating>=1, d={...day,seen:[...day.seen],wrong:[...day.wrong]};
  if(!d.seen.includes(p.id)) d.seen.push(p.id);
  let nd=deck;
  if(right){ d.right++; d.wrong=d.wrong.filter(id=>id!==p.id); }
  else{ if(!d.wrong.includes(p.id)) d.wrong.push(p.id); nd=[...deck,{...p,_retry:true}]; }
  let next=index+1; while(next<nd.length&&nd[next]._retry&&d.right>=REVIEW_RIGHT) next++;   // once 5 are right, the retries are no longer needed
  return { day:d, deck:nd, next, over:next>=nd.length||(d.seen.length>=REVIEW_DAILY&&d.right>=REVIEW_RIGHT) };

const longestPart = t => Math.max(0,...String(t||"").split(/\s[\/·|]\s|[\/·|،,؛;]/).map(x=>x.trim()).filter(Boolean).map(wordCount));   // "مطرب / المغنين" = alternatives: count the longest side
const kindOf = p => {
  const f=String(p.foreign_text||"").trim(), n=String(p.native_text||"").trim();
  if(/[.!?؟…]$/.test(f)||/[.!?؟…]$/.test(n)) return "Phrase";
  return longestPart(f)>=3||longestPart(n)>=4?"Phrase":"Word";     // "شكرا جزيلا" = "Thank you so much" is a phrase; "صاحب العمل" = "Employer" is a word

function useIsDesktop() {
  const [big,setBig] = useState(()=>typeof window!=="undefined"&&window.matchMedia(DESKTOP_Q).matches);
  useEffect(()=>{
    const mq=window.matchMedia(DESKTOP_Q), h=e=>setBig(e.matches);
    mq.addEventListener?mq.addEventListener("change",h):mq.addListener(h);
    return ()=>{ mq.removeEventListener?mq.removeEventListener("change",h):mq.removeListener(h); };
  },[]);

function calcNextReview(p,rating) {

}
function calcStreak(phrases) {
  const dates=[...new Set(phrases.filter(p=>p.last_reviewed).map(p=>p.last_reviewed.slice(0,10)))].sort().reverse();
  if(!dates.length)return 0;
  const today=todayStr(),yest=new Date(Date.now()-86400000).toISOString().slice(0,10);
  if(dates[0]!==today&&dates[0]!==yest)return 0;
  let s=0,check=dates[0]===today?today:yest;
  for(const d of dates){if(d===check){s++;check=new Date(new Date(check).getTime()-86400000).toISOString().slice(0,10);}else if(d<check)break;}
  return s;
}

// ── Scanning ──────────────────────────────────────────────────────────────────
// The model is reached through our own Supabase Edge Function (supabase/functions/scan),
// which holds the Gemini key server-side. Nothing secret lives in this file.
const SCAN_URL = `${SB_URL}/functions/v1/scan`;

// Phrases + meanings from Gemini, via the Edge Function.
async function scanImage(base64, mediaType, accessToken) {
  let res;
  try{
    res = await fetch(SCAN_URL,{
      method:"POST",
      headers:{ "Content-Type":"application/json", apikey:SB_KEY, Authorization:`Bearer ${accessToken||SB_KEY}` },
      body:JSON.stringify({image:base64, mediaType}),
    });
  }catch{
    // A missing function 404s without CORS headers, which surfaces here as a network error.
    throw new Error("Couldn't reach the scanning service.");
  }
  let data={}; try{ data=await res.json(); }catch{}
  if(res.status===404) throw new Error("The scanning service isn't set up yet.");
  if(!res.ok) throw new Error(data.error||`Scanning failed (${res.status}).`);
  return {
    phrases: Array.isArray(data.phrases)?data.phrases:[],
    lines:   Array.isArray(data.raw_lines)?data.raw_lines.filter(l=>typeof l==="string"&&l.trim()):[],
    notice:  typeof data.error==="string"?data.error:"",   // e.g. the image was blocked
  };
}

// Plain text reading on the device (Tesseract), loaded only when first needed.
// Needs no server and costs nothing, so a scan always shows what it read — even
// when the scanning service is down or not deployed.
const TESSERACT_SRC = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
const OCR_LANG = { Arabic:"ara", French:"fra", Spanish:"spa" };
let ocr = { langs:"", worker:null };

const loadScript = src => new Promise((resolve,reject)=>{
  if(window.Tesseract) return resolve();
  const el=document.createElement("script");
  el.src=src; el.onload=resolve; el.onerror=()=>reject(new Error("Couldn't load the text reader."));
  document.head.appendChild(el);
});
async function getOcrWorker(langs){
  if(ocr.langs===langs&&ocr.worker) return ocr.worker;
  const previous=ocr.worker;
  ocr={ langs, worker:Tesseract.createWorker(langs.split("+")) };   // stored as a promise so parallel scans share it
  if(previous) previous.then(w=>w.terminate()).catch(()=>{});
  return ocr.worker;
}
const cleanLines = text => [...new Set(
  // Tesseract wraps RTL lines in invisible direction marks; strip them before they get saved into phrases
  String(text||"").split(/\r?\n/).map(l=>l.replace(/[\u200E\u200F\u202A-\u202E\u2066-\u2069]/g,"").replace(/\s+/g," ").trim()).filter(l=>l.length>1&&/\p{L}/u.test(l))
)].slice(0,60);

async function readTextOnDevice(dataUrl, language){
  await loadScript(TESSERACT_SRC);
  const worker = await getOcrWorker(`${OCR_LANG[language]||"ara"}+eng`);
  const { data } = await worker.recognize(dataUrl);
  return cleanLines(data.text);
}

// Phone photos are routinely 4-8MB; shrink before reading or uploading. Arabic dots and
// diacritics are tiny, so keep plenty of resolution and prefer lossless PNG (screenshots
// stay crisp) unless that would bust the scan function's 5MB limit.
async function shrinkImage(file, max=2400){
  const src = await readAsDataUrl(file);
  const img = await new Promise((resolve,reject)=>{ const i=new Image(); i.onload=()=>resolve(i); i.onerror=reject; i.src=src; });
  const scale = Math.min(1, max/Math.max(img.naturalWidth,img.naturalHeight));
  const canvas = document.createElement("canvas");
  canvas.width = Math.round(img.naturalWidth*scale); canvas.height = Math.round(img.naturalHeight*scale);
  canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);
  let dataUrl = canvas.toDataURL("image/png"), mediaType = "image/png";
  if(dataUrl.length*3/4 > 4*1024*1024){ dataUrl = canvas.toDataURL("image/jpeg",.92); mediaType = "image/jpeg"; }
  return { dataUrl, base64:dataUrl.split(",")[1], mediaType };
}
const isArabicScript = s => /\p{Script=Arabic}/u.test(s);

// ── Bulk paste ────────────────────────────────────────────────────────────────
// Turns pasted text into { foreign_text, native_text, notes, language, topic } rows.
//   One line = one phrase: its Arabic is the phrase, its Latin parts are the transliteration
//   and the translation ("marhaban - Hello - مرحبا"). The translation is the part next to
//   the Arabic, so "مرحبا - Hello - marhaban" reads the same way. A bracketed part, or one
//   that looks romanised (ā, ḥ, 3, 7…), is taken as the transliteration.
//   Lines holding only one script pair up with their neighbours ("مرحبا" / "Hello").
//   A heading line ("Food:", "# Travel") sets the category of the phrases beneath it.
//   Text with no Arabic at all falls back to "phrase - meaning - notes" per line.
const BIDI_MARKS = /[‎‏‪-‮⁦-⁩]/g;
const BULLET     = /^\s*(?:[\d٠-٩]+\s*[.)\-:]|[-•*·▪●])\s+/;
// What separates the parts of a line. Only unambiguous ones count: a dash, slash or colon with
// a space each side, a run of dashes, a tab, or | = ~ →. A lone "-" or "/" touching letters
// ("al-khayr", "and/or", "صباح-الخير") belongs to the word and stays.
const PART_SPLIT = /\t+|\s+[-–—/:：]+\s+|[-–—]{2,}|\s*[|=~→]+\s*/;
const EDGE_JUNK  = /^[\s\-–—=:|/•·>→,;،؛]+|[\s\-–—=:|/•·>→,;،؛]+$/g;
const LOOKS_ROMANISED = /[Ā-ſḀ-ỿʻ-ʿ]|[a-z][2-9]|[2-9][a-z]/i;

const TOPIC_ALIASES = {
  Greetings:  ["greeting","salutation","introduction","meeting people"],
  Politeness: ["polite","manners","courtesy","courtesies","polite phrases"],
  Questions:  ["question","asking questions","question words"],
  Emotions:   ["emotion","feelings","feeling","moods","mood"],
  Expressions:["expression","idioms","idiom","common phrases","common expressions","everyday phrases","sayings"],
  Food:       ["food and drink","drinks","dining","restaurant","restaurants","eating out","meals"],
  Travel:     ["travelling","traveling","transport","transportation","directions","airport","hotel","hotels","getting around"],
  Other:      ["misc","miscellaneous","general","various"],
};
// A category name typed or pasted by the user: Title Case, short.
const newTopicName = x => String(x).trim().split(/\s+/).map(w=>w.charAt(0).toUpperCase()+w.slice(1).toLowerCase()).join(" ").slice(0,30).trim();
const normTopic = x => String(x).toLowerCase().replace(/\s*&\s*/g," and ").replace(/[^\p{L}\s]/gu,"").replace(/\s+/g," ").trim();
// exact: only the category's own name (safe for a bare word on a line); otherwise aliases too.
// extra: custom categories already in the app, matched ignoring case so headings reuse them.
function topicFromName(name, exact=false, extra=[]){
  const n=normTopic(name);
  if(!n) return null;
  const hit=TOPICS.find(t=>t.id!=="All"&&(t.id.toLowerCase()===n||t.label.toLowerCase()===n))?.id||extra.find(x=>normTopic(x)===n);
  if(hit) return hit;
  if(exact) return null;
  const alias=Object.entries(TOPIC_ALIASES).find(([,a])=>a.includes(n));
  return alias?alias[0]:null;
}

// A heading that carries a marker ("Food:", "# Travel", "== Greetings ==", "Category: Emotions",
// "[Questions]") and names a category. An unfamiliar name only counts when it is clearly a heading
// (strong marker, or a trailing colon above a phrase line) and becomes a new category.
function bulkHeader(line, next, extra){
  if(!line||line.length>40||isArabicScript(line)) return null;
  let s=line, strong=false, weak=false, colon=false;
  const cut=(re,kind)=>{ s=s.replace(re,()=>{ if(kind==="strong") strong=true; else weak=true; if(kind==="colon") colon=true; return ""; }); };
  cut(/^\s*(?:#{1,6}|={2,}|\*{2,}|-{2,}|—+)\s*/,"strong");
  cut(/^\s*(?:category|topic|section|theme|group)\s*[:：=\-–—]\s*/i,"strong");
  cut(/^\s*[\[(<]\s*/,"weak");
  cut(/\s*(?:#{1,6}|={2,}|\*{2,}|-{2,}|—+)\s*$/,"strong");
  cut(/\s*[:：]\s*$/,"colon");
  cut(/\s*[\])>]\s*$/,"weak");
  if(/^\s*\p{Extended_Pictographic}/u.test(s)) weak=true;        // "✈️ Getting around"
  s=s.replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu,"").trim();   // emoji and stray marks
  if(!s||!(strong||weak||colon)||PART_SPLIT.test(s)||s.split(" ").length>5) return null;
  const topic=topicFromName(s,false,extra);
  if(topic) return {topic};
  const phraseBelow=!!next&&isArabicScript(next);
  if(!(strong||(colon&&phraseBelow))) return null;
  const fresh=newTopicName(s);
  return fresh?{topic:fresh,isNew:true}:null;
}
// A bare category word ("Food") on its own, after a blank line, above phrases or a blank line.
function bareHeader(lines, i, extra){
  if(i>0&&lines[i-1]) return null;
  const topic=topicFromName(lines[i],true,extra), nx=lines[i+1];
  if(!topic||nx===undefined) return null;
  const mixed=isArabicScript(nx)&&/\p{Script=Latin}/u.test(nx);
  return nx===""||mixed?{topic}:null;
}

// Cuts a line into runs of Arabic-script vs other letters. Digits, punctuation and marks ride
// along with the run they sit in (so a dash between two Arabic words stays in the Arabic); an
// opening bracket goes to the run it opens. Latin runs are then split at real separators.
function bulkRuns(line){
  const runs=[]; let cur=null, pend="";
  const close=()=>{ if(cur){ const t=cur.text.replace(EDGE_JUNK,""); if(t) runs.push({type:cur.type,text:t}); cur=null; } };
  for(const ch of line){
    const type=/\p{Script=Arabic}/u.test(ch)?"ar":/\p{L}/u.test(ch)?"en":null;
    if(!type){ pend+=ch; continue; }
    if(cur&&cur.type!==type){
      const open=pend.match(/[(\[{«“"']*$/)[0];
      cur.text+=pend.slice(0,pend.length-open.length); close(); pend=open;
    }
    if(!cur) cur={type,text:""};
    cur.text+=pend+ch; pend="";
  }
  if(cur){ cur.text+=pend; close(); }
  return runs.flatMap(r=>r.type==="en"
    ? r.text.split(PART_SPLIT).map(t=>t.replace(EDGE_JUNK,"")).filter(Boolean).map(text=>({type:"en",text}))
    : [{type:"ar",text:r.text.replace(/\s*(?:\t+|[|=~→]+)\s*/g," / ").replace(/\s+/g," ")}]);
}

// → { rows, categories: [existing ids named in headings], created: [new category names] }
// extraTopics: the custom category ids the app already has.
function parseBulk(text, fallbackLang, extraTopics=[]){
  const lines=String(text||"").replace(BIDI_MARKS,"").split(/\r?\n/)
    .map(l=>l.replace(BULLET,"").replace(/[^\S\t]+/g," ").trim());
  const arabic=isArabicScript(lines.join(" "));
  const rows=[], categories=[], created=[];
  let topic="Other", g=null;
  const add=(foreign_text,native_text,notes,language,t)=>rows.push({ key:`bulk_${rows.length}`, keep:true, foreign_text, native_text, notes, language, topic:t });

  // A group is everything that belongs to one phrase: its Arabic parts and its Latin parts.
  const emit=grp=>{
    const notes=[], means=[]; let t=grp.topic;
    const note=x=>{ const own=topicFromName(x,true,extraTopics); if(own) t=own; else if(x) notes.push(x); };   // "(Food)" names the category
    for(const part of (grp.enBefore?[...grp.en].reverse():grp.en)){   // English before the Arabic: read it from the Arabic outwards
      let text=part;
      const lead=text.match(/^[(\[]([^)\]]*)[)\]]\s*(.*)$/);      // "(marhaban) Hello" → note + meaning
      if(lead){ note(lead[1].trim()); text=lead[2].trim(); }
      const tail=text.match(/^(.*?)\s*[(\[]([^)\]]*)[)\]]$/);     // "Hello (marhaban)"
      if(tail&&tail[1].trim()){ note(tail[2].trim()); text=tail[1].trim(); }
      if(text) means.push(text);
    }
    // The translation is the Latin part nearest the Arabic; the next one out is the transliteration,
    // unless only one of the two looks romanised (then that one is).
    if(means.length>1&&LOOKS_ROMANISED.test(means[0])&&!LOOKS_ROMANISED.test(means[1])) means.unshift(...means.splice(0,2).reverse());
    const [meaning="",...extra]=means;
    add(grp.ar.join(" / "),meaning,[...notes,...extra].join(" · "),"Arabic",t);
  };
  const flush=()=>{ if(g&&(g.ar.length||g.en.length)) emit(g); g=null; };
  const nextLine=i=>lines.slice(i+1).find(Boolean)||"";

  for(let i=0;i<lines.length;i++){
    const line=lines[i];
    if(!line){ flush(); continue; }
    const h=bulkHeader(line,nextLine(i),extraTopics)||bareHeader(lines,i,extraTopics);
    if(h){
      flush(); topic=h.topic;
      if(h.isNew){ if(!created.includes(h.topic)) created.push(h.topic); }
      else if(!categories.includes(h.topic)) categories.push(h.topic);
      continue;
    }
    if(!arabic){                                   // no Arabic anywhere: "phrase - meaning - notes"
      const [f,m="",...rest]=line.split(PART_SPLIT).map(x=>x.trim()).filter(Boolean);
      if(f) add(f,m,rest.join(" · "),fallbackLang,topic);
      continue;
    }
    const items=bulkRuns(line);
    const ar=items.filter(x=>x.type==="ar").map(x=>x.text), en=items.filter(x=>x.type==="en").map(x=>x.text);
    if(ar.length&&en.length){                      // both on one line: that line is the phrase
      const firstAr=items.findIndex(x=>x.type==="ar"), lastEn=items.map(x=>x.type).lastIndexOf("en");
      flush(); emit({ar,en,topic,enBefore:lastEn<firstAr}); continue;
    }
    if(ar.length){
      if(g&&g.ar.length) flush();          // the previous phrase already has its Arabic: this starts the next
      if(!g) g={ar:[],en:[],topic};
      g.ar.push(...ar);
      if(g.en.length){ g.enBefore=true; flush(); }   // English came first, so the pair is complete
    }else if(en.length){
      if(!g) g={ar:[],en:[],topic};
      g.en.push(...en);                    // translation / transliteration lines follow their Arabic
    }
  }
  flush();
  return { rows, categories, created };
}

});

function PhraseCard({ p, onEdit, onDelete, dense=false, compact=false, classic=false, className="", style={}, ...rest }) {
  const lang = getLang(p.language), tag = statusTag(p), tc = getTopic(p.topic), ts = getTopicStyle(p.topic);

  const len      = (p.foreign_text||"").length;
  const shrink   = len>34 ? .52 : len>22 ? .64 : len>12 ? .78 : 1;
  const artSide  = lang.rtl ? "left" : "right";   // opposite the reading edge
  const emojiArt = !hasTopicSvg(p.topic);
  const tilt     = lang.rtl ? -9 : 9;

  // The category, beside the translation
  const pillStyle = {fontSize:10,padding:"2px 8px",borderRadius:20,background:T.surfaceHi,border:`1px solid ${T.borderMid}`,color:T.inkMid,fontFamily:BODY,fontWeight:600,whiteSpace:"nowrap",lineHeight:1.4};
  const tagPill = (<>
    <span style={pillStyle}>{tc.label}</span>
    <span title="Word or phrase" style={{...pillStyle,background:"transparent"}}>{kindOf(p)}</span>
  </>);
  const iconBtn = (label,onClick,icon) => (
    <button className="ib" aria-label={label} title={label} onClick={e=>{e.stopPropagation();onClick();}}
      style={{background:"transparent",border:"none",color:INK,padding:5,borderRadius:8,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>{icon}</button>
  );
  // Edit and delete: bottom right, shown when the card is hovered (always on touch screens)
  const actions = (size,pos) => (onEdit||onDelete)?(
    <div className="card-actions" style={{display:"flex",...pos}}>
      {onEdit&&iconBtn("Edit phrase",()=>onEdit(p),<IconEdit size={size}/>)}
      {onDelete&&iconBtn("Delete phrase",()=>onDelete(p.id),<IconTrash size={size}/>)}
    </div>
  ):null;
  const statusPill = tag&&<span style={{fontSize:9,padding:"2px 8px",borderRadius:20,background:tag.color,border:outline(1.5),fontFamily:HEAD,fontWeight:800,letterSpacing:.5,textTransform:"uppercase",color:INK,whiteSpace:"nowrap"}}>{tag.label}</span>;
  const duePill = isDue(p)&&<span title="Due for review" style={{display:"inline-flex",color:classic?"#fff":INK}}><IconBolt size={compact?15:19}/></span>;   // an outline bolt, no badge around it

  // ── Compact card: the grid. About half the height of the big one, so more fit on screen. ──
  if(compact){
    const cHero = Math.round((lang.rtl?30:26)*(len>34?.62:len>22?.76:len>12?.9:1));
    return (
      <div className={`pcard ${className}`}
        style={{borderRadius:18,overflow:"hidden",background:T.surface,userSelect:"none",border:outline(2.5),display:"flex",flexDirection:"column",height:"100%",...style}} {...rest}>
        <div style={{background:ts.bg,padding:"10px 12px",display:"flex",alignItems:"center",gap:10,flexDirection:lang.rtl?"row":"row-reverse",minHeight:78}}>
          {emojiArt?(
            <div aria-hidden="true" style={{width:62,height:62,flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",fontSize:44,lineHeight:1,transform:`rotate(${tilt}deg)`,filter:"url(#sticker)"}}>{tc.icon}</div>
          ):(
            <div style={{width:62,height:62,flexShrink:0,transform:`rotate(${lang.rtl?-5:5}deg)`,filter:"url(#sticker)"}}><TopicArt topic={p.topic}/></div>
          )}
          <div dir={lang.rtl?"rtl":"ltr"}
            style={{flex:1,minWidth:0,fontSize:cHero,fontFamily:heroFont,lineHeight:lang.rtl?1.25:1,textAlign:lang.rtl?"right":"left",color:ts.fg,
                    fontWeight:lang.rtl?700:400,letterSpacing:lang.rtl?0:"-.3px",overflowWrap:"anywhere",textShadow:"none"}}>
            {p.foreign_text}
          </div>
        </div>
        <div style={{borderTop:outline(2.5),padding:"9px 12px 8px",display:"flex",flexDirection:"column",gap:5,flex:1,minHeight:0}}>
          <div style={{display:"flex",flexWrap:"wrap",alignItems:"center",gap:"3px 8px"}}>
            <span style={{fontSize:16,color:INK,fontFamily:HEAD,fontWeight:800,lineHeight:1.2,letterSpacing:"-.3px",overflowWrap:"anywhere"}}>{p.native_text}</span>
            {tagPill}
          </div>
          {p.notes&&<div style={{fontSize:12,color:T.inkMid,fontFamily:BODY,fontWeight:300,lineHeight:1.3}}>{p.notes}</div>}
          <div style={{marginTop:"auto",paddingTop:2,display:"flex",alignItems:"center",gap:6,minHeight:26}}>
            {statusPill}{duePill}
            {acc!==null&&<span style={{fontSize:10,color:T.muted,fontFamily:BODY}}>{acc}% · {p.total_reviews}</span>}
            <span style={{flex:1}}/>
            {actions(15,{})}
          </div>
        </div>
      </div>
    );
  }

  const heroSize = Math.round((lang.rtl ? (dense?42:66) : (dense?34:54)) * shrink);
  const artW     = dense?96:124;
  // classic: the big card's original look: saturated colour, white text, thick outlines, a framed picture
  const line = w => classic?`${w}px solid ${INK}`:outline(w);

  return (
    <div className={`pcard ${className}`}
      style={{borderRadius:dense?20:26,overflow:"hidden",background:T.surface,userSelect:"none",
              ...(classic?{border:`2.5px solid ${INK}`,borderRightWidth:5,borderBottomWidth:5}:{border:outline(2.5)}),   // classic: a heavier right and bottom edge
              display:"flex",flexDirection:"column",...style}} {...rest}>

      {/* ── Poster half: subject colour, hero phrase, picture ── */}
      <div style={{flex:"2.7 1 0",minHeight:0,background:classic?ts.deep:ts.bg,position:"relative",overflow:"hidden",
                   padding:dense?"14px 16px":"18px 22px",display:"flex",flexDirection:"column"}}>

        {/* due badge (the language · category tag sits beside the translation) */}
        {isDue(p)&&<div style={{display:"flex",justifyContent:"flex-end",position:"relative",zIndex:3,minHeight:26}}>{duePill}</div>}

        {/* hero phrase */}
        <div style={{position:"relative",zIndex:2,flex:1,display:"flex",alignItems:"flex-start",minHeight:0,overflow:"hidden",
                     paddingTop:dense?10:14,paddingBottom:artW*0.61+(dense?10:14),
                     paddingLeft:lang.rtl?artW*0.5:0,paddingRight:lang.rtl?0:artW*0.5}}>
          <div dir={lang.rtl?"rtl":"ltr"}
            style={{fontSize:heroSize,fontFamily:heroFont,lineHeight:lang.rtl?1.2:.94,
                    textAlign:lang.rtl?"right":"left",color:classic?"#fff":ts.fg,
                    fontWeight:lang.rtl?700:400,letterSpacing:lang.rtl?0:"-.5px",
                    width:"100%",overflowWrap:"anywhere",textShadow:classic?"2px 2px 0 rgba(26,24,37,.28)":"none"}}>
            {p.foreign_text}
          </div>
        </div>

        {/* the picture: the illustration (or the category's emoji) as a tilted sticker, no box around it */}
        {emojiArt?(
          <div aria-hidden="true" style={{position:"absolute",bottom:dense?8:12,[artSide]:dense?14:20,zIndex:2,fontSize:Math.round(artW*.82),lineHeight:1,
                       transform:`rotate(${tilt}deg)`,filter:"url(#sticker)"}}>{tc.icon}</div>
        ):(
          <div style={{position:"absolute",bottom:dense?10:14,[artSide]:dense?12:18,zIndex:2,width:artW,height:artW,transform:`rotate(${lang.rtl?-5:5}deg)`,filter:"url(#sticker)"}}>
            <TopicArt topic={p.topic}/>
          </div>
        )}

        {/* status sticker, opposite corner: New for 3 days, then mastery (straight) */}
        {tag&&<div style={{position:"absolute",bottom:dense?18:24,[lang.rtl?"right":"left"]:dense?16:22,zIndex:2,
                     background:tag.color,border:line(2),
                     borderRadius:20,padding:dense?"3px 11px":"4px 14px",boxShadow:drop(2,2)}}>
          <span style={{fontFamily:HEAD,fontWeight:800,fontSize:dense?9:11,letterSpacing:.5,
                        textTransform:"uppercase",color:INK,whiteSpace:"nowrap"}}>{tag.label}</span>
        </div>}
      </div>

      {/* ── Caption half: the translation and its category, poster-footer style ── */}
      <div style={{flex:"1.1 1 0",minHeight:0,background:T.surface,borderTop:line(2.5),display:"flex",position:"relative",
                   flexDirection:"column",justifyContent:"space-between",gap:6,
                   padding:dense?"11px 16px 12px":"14px 22px 16px",overflow:"hidden"}}>
        <div style={{minHeight:0,overflow:"hidden"}}>
          <div style={{fontSize:9,letterSpacing:2.5,color:T.muted,fontFamily:HEAD,fontWeight:700,textTransform:"uppercase",marginBottom:4}}>Meaning</div>
          <div style={{display:"flex",flexWrap:"wrap",alignItems:"center",gap:"4px 10px"}}>
            <div style={{fontSize:dense?18:22,color:INK,fontFamily:HEAD,fontWeight:800,lineHeight:1.15,letterSpacing:"-.4px",overflowWrap:"anywhere"}}>{p.native_text}</div>
            {tagPill}
          </div>
          {p.notes&&<div style={{fontSize:dense?13:14,color:T.inkMid,fontFamily:BODY,fontWeight:300,marginTop:6,lineHeight:1.35}}>{p.notes}</div>}
        </div>
        {acc!==null&&<div style={{fontSize:10,color:T.muted,fontFamily:BODY}}>{acc}% correct · {p.total_reviews} reviews</div>}
        {actions(17,{position:"absolute",right:dense?10:16,bottom:dense?8:12})}
      </div>
    </div>
  );
}

// ════════════════════════════════════════════════════════════════════════════
function BiliG() {
  // Auth
  const [session,     setSession]     = useState(()=>readStoredSession()||(LOGIN_ENABLED?null:VIEWER_SESSION));
  const [loginOpen,   setLoginOpen]   = useState(false);   // the admin login popup
  const [recovery,    setRecovery]    = useState(readRecovery);   // arrived from a password-recovery email
  const [newPw,       setNewPw]       = useState("");
  const [newPw2,      setNewPw2]      = useState("");
  const [recBusy,     setRecBusy]     = useState(false);
  const [recError,    setRecError]    = useState("");
  const [authView,    setAuthView]    = useState("login");
  const [authEmail,   setAuthEmail]   = useState("");
  const [authPw,      setAuthPw]      = useState("");
  const [authLoading, setAuthLoading] = useState(false);
  const [authError,   setAuthError]   = useState("");
  const [authSuccess, setAuthSuccess] = useState("");
  const isGuest = !!session?.guest;
  const readOnly = !!session?.viewer;
  const isDesktop = useIsDesktop();
  const [winH, setWinH] = useState(()=>window.innerHeight);
  useEffect(()=>{ const h=()=>setWinH(window.innerHeight); window.addEventListener("resize",h); return()=>window.removeEventListener("resize",h); },[]);
  const deckH = isDesktop ? Math.max(380, Math.min(500, winH-440)) : 480;
  const [seeding, setSeeding] = useState(false);
  const [libMode, setLibMode] = useState("deck"); // deck (swipeable) | grid — desktop only
  const [libTab,  setLibTab]  = useState("home");  // home (word of the day + categories) | cards (flashcard mode: the card library)
  const deckMode = !isDesktop || libMode==="deck";

  // App
  const [phrases,      setPhrases]      = useState([]);
  const [dbLoading,    setDbLoading]    = useState(false);
  const [view,         setView]         = useState("library"); // library | flashcard | form | scan
  const [stackIdx,     setStackIdx]     = useState(0);
  const [topicFilter,  setTopicFilter]  = useState("All");
  const [kindFilter,   setKindFilter]   = useState("All");   // All | Word | Phrase
  const [practiceMode, setPracticeMode] = useState("due");
  const [editPhrase,   setEditPhrase]   = useState(null);
  const [flipped,      setFlipped]      = useState(false);
  const [showRating,   setShowRating]   = useState(false);
  const [cardIndex,    setCardIndex]    = useState(0);
  const [cardDeck,     setCardDeck]     = useState([]);
  const [form,         setForm]         = useState({foreign_text:"",native_text:"",language:"Arabic",topic:"Greetings",notes:""});
  const [delConfirm,   setDelConfirm]   = useState(null);
  const [toast,        setToast]        = useState(null);
  const [scanBusy,     setScanBusy]     = useState(false);
  const [scanRows,     setScanRows]     = useState([]);   // review list
  const [scanError,    setScanError]    = useState("");   // hard failure: photo unusable
  const [scanNote,     setScanNote]     = useState("");   // soft: meanings unavailable, lines still usable
  const [scanLines,    setScanLines]    = useState([]);   // every line of text read from the photo
  const [linesBusy,    setLinesBusy]    = useState(false);
  const scanSeq = useRef(0);
  const [imgPreview,   setImgPreview]   = useState(null);
  const [bulkText,     setBulkText]     = useState("");   // pasted list
  const [bulkRows,     setBulkRows]     = useState(standbyRead);   // the review list: phrases on standby until they're added or ignored
  const [bulkNote,     setBulkNote]     = useState("");
  const [bulkBusy,     setBulkBusy]     = useState(false);
  const [deviceCount,  setDeviceCount]  = useState(0);     // phrases saved only on this device, waiting to be moved
  const [deviceBusy,   setDeviceBusy]   = useState(false);
  const [deviceHide,   setDeviceHide]   = useState(false);
  const [manageIds,    setManageIds]    = useState([]);          // the phrases the Edit screen is working on (a snapshot when it opened)
  const [manageSel,    setManageSel]    = useState(()=>new Set());
  const [manageEdits,  setManageEdits]  = useState({});          // id -> fields changed but not saved yet
  const [manageQ,      setManageQ]      = useState("");
  const [manageBusy,   setManageBusy]   = useState(false);
  const [manageDel,    setManageDel]    = useState(false);       // "delete N phrases?" confirmation
  const [catRows,      setCatRows]      = useState([]);          // categories saved with an emoji: [{name, emoji}]
  const [catsReady,    setCatsReady]    = useState(false);       // false until the categories table answers (it may not exist yet)
  const [settingsTab,  setSettingsTab]  = useState("phrases");   // phrases | categories
  const [emojiFor,     setEmojiFor]     = useState(null);        // whose emoji picker is open (a category name, or "__new__")
  const [catNameDraft, setCatNameDraft] = useState({});          // category -> the new name being typed
  const [newCat,       setNewCat]       = useState({name:"",emoji:""});
  const [catDel,       setCatDel]       = useState(null);        // category waiting on a delete confirmation
  const [catBusy,      setCatBusy]      = useState(false);
  const [loginFor,     setLoginFor]     = useState("add");       // what the admin login popup was opened for
  const [bulkAdding,   setBulkAdding]   = useState(false);     // showing the paste box even though phrases are already on standby
  const [ignoreAsk,    setIgnoreAsk]    = useState(null);        // "unticked" | "all": confirming that standby phrases are dropped
  const [bulkExtra,    setBulkExtra]    = useState([]);   // categories added on the review screen that no phrase uses yet
  const [catDraft,     setCatDraft]     = useState(null); // category being renamed / added: {mode:"rename"|"add"|"row", from?, key?, value}
  const [langOpen,     setLangOpen]     = useState(false);
  const [activeLang,   setActiveLang]   = useState("Arabic");
  // Swipe
  const deckLen = useRef(0);
  const topRef = useRef(null), nextRef = useRef(null), prevRef = useRef(null), deckDrag = useRef({}), justSwiped = useRef(false);

  const toastRef=useRef(null), fileRef=useRef(null), camRef=useRef(null), langRef=useRef(null);

  // Session
  useEffect(()=>{ if(session&&!session.viewer)localStorage.setItem("bilig_s",JSON.stringify(session)); else localStorage.removeItem("bilig_s"); },[session]);
  useEffect(()=>{ if(session)loadPhrases(); },[session]);
  useEffect(()=>{ const h=e=>{if(langRef.current&&!langRef.current.contains(e.target))setLangOpen(false);}; document.addEventListener("mousedown",h); return()=>document.removeEventListener("mousedown",h); },[]);
  useEffect(()=>setStackIdx(0),[topicFilter, kindFilter, activeLang]);
  // Arrow keys walk the deck (library only, so typing in the form is unaffected)
  useEffect(()=>{
    if(view!=="library"||!deckMode)return;
    const h=e=>{
      if(e.key==="ArrowRight")     setStackIdx(i=>Math.min(deckLen.current-1,i+1));
      else if(e.key==="ArrowLeft") setStackIdx(i=>Math.max(0,i-1));
    };
    window.addEventListener("keydown",h);
    return ()=>window.removeEventListener("keydown",h);
  },[view,deckMode]);

  const toast$ = (msg,type="success")=>{ clearTimeout(toastRef.current); setToast({msg,type}); toastRef.current=setTimeout(()=>setToast(null),3200); };
  // The live session, readable from inside a request without waiting for a re-render.
  const sessionRef = useRef(session);
  useEffect(()=>{ sessionRef.current=session; },[session]);
  const refreshing = useRef(null);

  // Swap the expired token for a fresh one. Callers share a single in-flight request.
  const refreshToken = () => {
    if(refreshing.current) return refreshing.current;
    const rt = sessionRef.current?.refresh_token;
    if(!rt) return Promise.resolve(null);
    refreshing.current = authFetch("/token?grant_type=refresh_token",{refresh_token:rt})
      .catch(()=>({}))
      .then(res=>{
        refreshing.current = null;
        if(!res.access_token) return null;
        const next = { access_token:res.access_token, refresh_token:res.refresh_token||rt,
                       expires_at_ms:Date.now()+(res.expires_in||3600)*1000, user:res.user||sessionRef.current?.user };
        sessionRef.current = next; setSession(next); return next;
      });
    return refreshing.current;
  };

  // An authenticated REST call. Renews the token when it is stale, and retries once
  // if the server rejects it anyway — a token can expire mid-flight, or while the
  // laptop is asleep and timers are frozen.
  const sbAuth = async (path, opts={}) => {
    let s = sessionRef.current;
    if(s?.refresh_token && (!s.expires_at_ms || s.expires_at_ms-Date.now() < 60000)) s = (await refreshToken()) || s;
    const send = tok => fetch(`${SB_URL}/rest/v1${path}`,{ ...opts,
      headers:{ apikey:SB_KEY, "Content-Type":"application/json", Prefer:"return=representation",
                Authorization:`Bearer ${tok}`, ...opts.headers } });
    let r = await send(s?.access_token);
    if(r.status===401){ const fresh = await refreshToken(); if(fresh) r = await send(fresh.access_token); }
    if(r.status===401){ endSession(); toast$("Your admin session ended. Sign in again to make changes.","info"); return null; }
    return r.json().catch(()=>null);
  };

  // DB
  const loadPhrases = async()=>{
    if(readOnly){                                    // the shared library: read with the public key, no login
      setDbLoading(true);
      const data=await sbFetch("/phrases?order=created_at.desc&limit=1000").catch(()=>null);
      if(Array.isArray(data)){ const prog=progressRead(); setPhrases(data.map(r=>({...r,...(prog[r.id]||{})}))); }
      else toast$("Could not load the phrases","error");
      setDbLoading(false); return;
    }
    if(isGuest){
      let rows=guestRead();
      let seeded=false; try{ seeded=!!localStorage.getItem("bilig_guest_seeded"); }catch{}
      if(!rows.length&&!seeded){ rows=buildStarters("guest"); guestWrite(rows); try{localStorage.setItem("bilig_guest_seeded","1");}catch{} }
      setPhrases(rows); return;
    }
    setDbLoading(true);
    const data=await sbAuth("/phrases?order=created_at.desc");
    if(Array.isArray(data)) setPhrases(data);
    else if(data?.code==="PGRST303"||/jwt/i.test(data?.message||"")) await renewSession();
    else toast$("Could not load — check Supabase table","error");
    setDbLoading(false);
  };
  const loadCategories = async()=>{
    const d=await sbFetch("/categories?select=name,emoji&order=created_at").catch(()=>null);
    if(Array.isArray(d)){ CATEGORY_EMOJI=Object.fromEntries(d.map(r=>[r.name,r.emoji])); setCatRows(d); setCatsReady(true); }
    else setCatsReady(false);                        // no table yet: emoji fall back to the automatic ones
  };
  useEffect(()=>{ loadCategories(); },[]);
  const dbInsert = async row=>{
    if(readOnly) return;
    if(isGuest){ const r={...row,id:newLocalId(),created_at:new Date().toISOString()}; setPhrases(p=>{const n=[r,...p];guestWrite(n);return n;}); return; }
    const d=await sbAuth("/phrases",{method:"POST",body:JSON.stringify(row)}); if(Array.isArray(d)&&d[0])setPhrases(p=>[d[0],...p]); else toast$("Save failed","error"); };
  const dbUpdate = async(id,patch)=>{
    if(readOnly){ const o=progressRead(); o[id]={...o[id],...patch}; progressWrite(o); setPhrases(p=>p.map(x=>x.id===id?{...x,...patch}:x)); return true; }
    if(isGuest){ setPhrases(p=>{const n=p.map(x=>x.id===id?{...x,...patch}:x);guestWrite(n);return n;}); return true; }
    // Supabase answers with the rows it changed: none means nothing was saved (not yours, or signed out)
    const d=await sbAuth(`/phrases?id=eq.${id}`,{method:"PATCH",body:JSON.stringify(patch)}).catch(()=>null);
    if(Array.isArray(d)&&d.length){ setPhrases(p=>p.map(x=>x.id===id?{...x,...patch}:x)); return true; }
    return false; };
  const dbDelete = async id=>{
    if(readOnly) return false;
    if(isGuest){ setPhrases(p=>{const n=p.filter(x=>x.id!==id);guestWrite(n);return n;}); return true; }
    const d=await sbAuth(`/phrases?id=eq.${id}`,{method:"DELETE"}).catch(()=>null);
    if(Array.isArray(d)&&d.length){ setPhrases(p=>p.filter(x=>x.id!==id)); return true; }
    return false; };

  // Auth
  const handleAuth = async e=>{
    e.preventDefault(); setAuthLoading(true); setAuthError(""); setAuthSuccess("");
    const res=await authFetch(authView==="login"?"/token?grant_type=password":"/signup",{email:authEmail,password:authPw});
    if(res.access_token) setSession({access_token:res.access_token,refresh_token:res.refresh_token,expires_at_ms:Date.now()+(res.expires_in||3600)*1000,user:res.user});
    else if(authView==="signup"&&res.id) setAuthSuccess("Check your email to confirm, then log in.");
    else setAuthError(res.error_description||res.msg||"Something went wrong");
    setAuthLoading(false);
  };
  const submitRecovery = async e=>{
    e.preventDefault();
    if(newPw.length<6){ setRecError("Use at least 6 characters."); return; }
    if(newPw!==newPw2){ setRecError("The two passwords don't match."); return; }
    setRecBusy(true); setRecError("");
    const r=await fetch(`${SB_URL}/auth/v1/user`,{ method:"PUT",
      headers:{ apikey:SB_KEY, Authorization:`Bearer ${recovery.token}`, "Content-Type":"application/json" },
      body:JSON.stringify({ password:newPw }) }).then(x=>x.json()).catch(()=>({}));
    if(r.id){                                        // updated: carry straight on, signed in
      clearHash(); setNewPw(""); setNewPw2("");
      setSession({ access_token:recovery.token, refresh_token:recovery.refresh, expires_at_ms:Date.now()+recovery.expires_in*1000, user:r });
      setRecovery(null); toast$("Password updated. You're signed in ✓");
    }else setRecError(r.msg||r.error_description||r.message||"Couldn't update the password. The link may have expired: request a new one.");
    setRecBusy(false);
  };
  const sendRecovery = async()=>{
    if(!authEmail.trim()){ setAuthError("Type your email above first."); return; }
    setAuthLoading(true); setAuthError(""); setAuthSuccess("");
    const back=location.protocol==="file:"?"":`?redirect_to=${encodeURIComponent(location.origin+location.pathname)}`;   // must be in Supabase's allowed redirect list
    const res=await authFetch(`/recover${back}`,{email:authEmail.trim()}).catch(()=>({error:"network"}));
    if(res&&(res.error||res.msg||res.error_code)) setAuthError(res.msg||res.error_description||"Couldn't send the email. Try again in a minute.");
    else setAuthSuccess("If that email has an account, a reset link is on its way.");
    setAuthLoading(false);
  };
  const addStarters = async()=>{
    setSeeding(true);
    const rows=buildStarters(session?.user?.id||"guest");
    if(isGuest) setPhrases(prev=>{ const n=[...rows,...prev]; guestWrite(n); return n; });
    else for(const {id,created_at,...row} of rows) await dbInsert(row);
    setActiveLang("Arabic"); setTopicFilter("All"); setStackIdx(0);
    toast$("5 starter phrases added ✓"); setSeeding(false);
  };
  const enterGuest = ()=>{ setAuthError(""); setAuthSuccess(""); setSession({guest:true,user:{id:"guest",email:"guest"}}); };

  // Sessions last about an hour: swap in a fresh token, or fall back to visitor mode if that fails.

  const daily = useMemo(()=>{

      <button type="button" onClick={()=>setView("library")}
        style={{background:"none",border:"none",color:T.muted,fontFamily:BODY,fontSize:12,fontWeight:600,cursor:"pointer",padding:0,marginBottom:10}}>← Back to the library</button>
      <div style={{fontSize:9,letterSpacing:4,color:T.lav,fontFamily:HEAD,textTransform:"uppercase",marginBottom:5}}>Settings</div>
      <div style={{display:"flex",gap:6,background:T.surfaceHi,border:outline(),borderRadius:14,padding:4,width:"fit-content",boxShadow:drop(2,2)}}>
        {[["phrases","Phrases"],["categories","Categories"]].map(([k,l])=>(
          <button key={k} type="button" onClick={()=>{ setSettingsTab(k); setEmojiFor(null); }} aria-pressed={settingsTab===k}
            style={{background:settingsTab===k?INK:"transparent",color:settingsTab===k?"#fff":INK,border:"none",borderRadius:10,padding:"8px 18px",cursor:"pointer",fontFamily:HEAD,fontWeight:700,fontSize:13}}>{l}</button>
        ))}
      </div>
    </div>
  );
  const removeCat = t=>{ setBulkRows(rows=>rows.map(r=>r.topic===t?{...r,topic:"Other"}:r)); setBulkExtra(x=>x.filter(c=>c!==t)); };
  const bulkKept = bulkRows.filter(r=>r.keep&&r.foreign_text.trim()&&r.native_text.trim());
  const bulkShowPaste = !bulkRows.length||bulkAdding;      // the paste box, or the review list of what is on standby
  const bulkIncomplete = bulkRows.filter(r=>r.keep&&!(r.foreign_text.trim()&&r.native_text.trim())).length;
  // Adds the ticked, complete phrases in one request (all or none). Everything else stays on standby.
  const saveBulk = async()=>{
    if(!bulkKept.length){ toast$("Nothing to add — each ticked phrase needs its text and translation","error"); return; }
    setBulkBusy(true);
    const body=bulkKept.map(r=>({
      foreign_text:r.foreign_text.trim(), native_text:r.native_text.trim(), language:r.language, topic:r.topic, notes:(r.notes||"").trim(),
      date:todayStr(), srs_reps:0, srs_interval:1, srs_next_review:null, total_reviews:0, good_reviews:0, user_id:session.user?.id,
    }));
    let ok=false, why="";
    if(isGuest){ for(const row of body) await dbInsert(row); ok=true; }
    else{
      const d=await sbAuth("/phrases",{method:"POST",body:JSON.stringify(body)}).catch(()=>null);
      if(Array.isArray(d)&&d.length){ setPhrases(prev=>[...d,...prev]); ok=true; } else why=d?.message||"No response from Supabase.";
    }
    setBulkBusy(false);
    if(!ok){ toast$(`Couldn't add them — nothing was changed. ${why}`,"error"); return; }
    const done=new Set(bulkKept.map(r=>r.key)), n=bulkKept.length, left=bulkRows.length-n;
    setBulkRows(rows=>rows.filter(r=>!done.has(r.key)));
    setActiveLang(bulkKept[0].language); setTopicFilter("All"); setStackIdx(0); setCatDraft(null); setBulkExtra([]);
    if(left<=0){ setBulkText(""); setBulkNote(""); setView("library"); toast$(`${n} phrase${n>1?"s":""} added ✓`); }
    else toast$(`${n} phrase${n>1?"s":""} added ✓ · ${left} still on standby`);
  };
  useEffect(()=>{ if(!readOnly){ try{ localStorage.setItem(STANDBY_KEY,JSON.stringify(bulkRows)); }catch{} } },[bulkRows,readOnly]);   // standby is kept on this device
  const ignoreStandby = which=>{ setBulkRows(rows=>which==="all"?[]:rows.filter(r=>r.keep)); setIgnoreAsk(null); if(which==="all"&&view==="bulk") setView("library"); };

  // ── Edit many: change fields on lots of saved phrases, or tick some to recategorise / delete them ──
  const MANAGE_FIELDS = ["foreign_text","native_text","notes","language","topic"];
  const openSettings = (tab="phrases")=>{
    if(readOnly)return;
    setSettingsTab(tab); setManageIds(phrases.filter(p=>p.language===activeLang).map(p=>p.id));
    setManageSel(new Set()); setManageEdits({}); setManageQ(""); setCatDraft(null); setEmojiFor(null); setView("settings");
  };
  const inManage = view==="settings"&&settingsTab==="phrases";
  const manageRows = useMemo(()=>{ const byId=new Map(phrases.map(p=>[p.id,p])); return manageIds.map(id=>byId.get(id)).filter(Boolean); },[phrases,manageIds]);
  const manageView = p=>({...p,...(manageEdits[p.id]||{})});
  const manageChanged = p=>{ const e=manageEdits[p.id]||{}, patch={}; for(const f of MANAGE_FIELDS) if(f in e&&String(e[f]??"").trim()!==String(p[f]??"").trim()) patch[f]=String(e[f]??"").trim(); return patch; };
  const manageDirty = manageRows.filter(p=>Object.keys(manageChanged(p)).length>0);
  const manageShown = manageRows.filter(p=>{
    const toks=fold(manageQ).split(" ").filter(Boolean); if(!toks.length) return true;
    const v=manageView(p), hay=[v.foreign_text,v.native_text,v.notes,getTopic(v.topic).label,TOPIC_AR[v.topic],kindOf(v)].map(fold);   // the phrase, translation, transliteration, category (English and Arabic), Word/Phrase
    return toks.every(t=>hay.some(h=>h.includes(t)));                                                                              // every word typed must be found somewhere
  });
  const patchManage = (id,patch)=>setManageEdits(e=>({...e,[id]:{...(e[id]||{}),...patch}}));
  function applyToSelected(patch){ setManageEdits(e=>{ const n={...e}; manageSel.forEach(id=>{ n[id]={...(n[id]||{}),...patch}; }); return n; }); }
  const toggleManageSel = (id,on)=>setManageSel(s=>{ const n=new Set(s); if(on) n.add(id); else n.delete(id); return n; });
  const saveManage = async()=>{
    if(!manageDirty.length) return;
    if(manageDirty.some(p=>{ const v=manageView(p); return !String(v.foreign_text||"").trim()||!String(v.native_text||"").trim(); })){ toast$("Every edited phrase needs its text and its translation","error"); return; }
    setManageBusy(true);
    const results=await Promise.all(manageDirty.map(p=>dbUpdate(p.id,manageChanged(p))));
    const failed=manageDirty.filter((p,i)=>!results[i]);
    setManageEdits(Object.fromEntries(failed.map(p=>[p.id,manageEdits[p.id]])));   // keep the edits that didn't save
    if(failed.length) toast$(`${manageDirty.length-failed.length} saved, ${failed.length} couldn't be saved. Try signing in again.`,"error");
    else toast$(`${manageDirty.length} phrase${manageDirty.length>1?"s":""} updated ✓`);
    setManageBusy(false);
  };
  const deleteManage = async()=>{
    const ids=[...manageSel]; if(!ids.length) return;
    setManageBusy(true);
    const results=await Promise.all(ids.map(id=>dbDelete(id)));
    const gone=new Set(ids.filter((id,i)=>results[i])), failed=ids.length-gone.size;
    setManageIds(a=>a.filter(id=>!gone.has(id)));
    setManageSel(new Set(ids.filter(id=>!gone.has(id))));
    setManageEdits(e=>Object.fromEntries(Object.entries(e).filter(([id])=>!gone.has(id))));
    setManageDel(false); setManageBusy(false);
    if(failed) toast$(`${gone.size} deleted, ${failed} couldn't be deleted`,"error"); else toast$(`${gone.size} phrase${gone.size>1?"s":""} deleted`,"info");
  };

  // Deck swipe: the top card follows the finger (or mouse), tilting as it goes, with the neighbouring card coming up
  // underneath. Let go past ~90px, or flick it, and it flies off; otherwise it springs back. Past either end it resists.
  useEffect(()=>{ justSwiped.current=false; });      // only skips the entry animation of the card a swipe just revealed
  const deckReveal = dx=>{
    const p=Math.min(1,Math.abs(dx)/170), up=dx<0?nextRef.current:prevRef.current, other=dx<0?prevRef.current:nextRef.current;
    if(up){ up.style.transition="none"; up.style.opacity=String(Math.min(1,p*1.7)); up.style.transform=`scale(${.94+.06*p}) translateY(${(1-p)*12}px)`; }
    if(other){ other.style.transition="none"; other.style.opacity="0"; }
  };
  const deckDown = e=>{ if(e.target.closest?.("button")) return; deckDrag.current={id:e.pointerId,x0:e.clientX,y0:e.clientY,t0:performance.now(),on:false,dx:0,atEnd:false}; };
  const deckMove = e=>{
    const d=deckDrag.current; if(d.id!==e.pointerId||d.x0===undefined) return;
    const dx=e.clientX-d.x0, dy=e.clientY-d.y0;
    if(!d.on){ if(Math.abs(dx)<7||Math.abs(dx)<Math.abs(dy)*1.2) return; d.on=true; try{ e.currentTarget.setPointerCapture(e.pointerId); }catch{} }
    d.atEnd=(dx<0&&stackIdx>=filtered.length-1)||(dx>0&&stackIdx<=0);
    d.dx=d.atEnd?dx*.3:dx;
    const el=topRef.current; if(!el) return;
    el.style.transition="none"; el.style.transform=`translate3d(${d.dx}px,0,0) rotate(${d.dx*.055}deg)`;
    if(!d.atEnd) deckReveal(d.dx);
  };
  const deckUp = e=>{
    const d=deckDrag.current; if(d.id!==e.pointerId||!d.on){ deckDrag.current={}; return; }
    const el=topRef.current, dx=d.dx, vx=dx/Math.max(1,performance.now()-d.t0), atEnd=d.atEnd;
    deckDrag.current={};
    if(!el) return;
    if(!atEnd&&(Math.abs(dx)>90||(Math.abs(dx)>35&&Math.abs(vx)>.45))){
      const dir=dx<0?-1:1, step=dx<0?1:-1, up=dx<0?nextRef.current:prevRef.current;
      el.style.transition="transform .26s cubic-bezier(.3,.7,.3,1)"; el.style.transform=`translate3d(${dir*window.innerWidth*1.1}px,0,0) rotate(${dir*20}deg)`;
      if(up){ up.style.transition="transform .26s ease, opacity .26s ease"; up.style.opacity="1"; up.style.transform="scale(1) translateY(0)"; }
      try{ navigator.vibrate?.(8); }catch{}
      setTimeout(()=>{ justSwiped.current=true; setStackIdx(i=>Math.max(0,Math.min(filtered.length-1,i+step))); },250);
    }else{
      el.style.transition="transform .34s cubic-bezier(.2,1.25,.4,1)"; el.style.transform="translate3d(0,0,0) rotate(0deg)";
      [nextRef.current,prevRef.current].forEach(u=>{ if(u){ u.style.transition="transform .3s ease, opacity .3s ease"; u.style.opacity="0"; u.style.transform="scale(.94) translateY(12px)"; } });
    }
  };

  const iSt={width:"100%",background:T.surface,border:`1px solid ${T.borderMid}`,borderRadius:12,padding:"12px 15px",color:T.ink,boxSizing:"border-box",transition:"border-color .2s,box-shadow .2s",fontFamily:BODY,fontSize:14};
  const shell={width:"100%",maxWidth:isDesktop?1260:"none",marginLeft:"auto",marginRight:"auto"};
  const pad =isDesktop?"0 40px":"0 22px";
  const lSt={display:"block",fontSize:9,letterSpacing:3,color:T.muted,fontFamily:HEAD,textTransform:"uppercase",marginBottom:8};

  const css = `
    *,*::before,*::after{box-sizing:border-box;}
    @keyframes fadeDown{from{opacity:0;transform:translateX(-50%) translateY(-8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
    @keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    @keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
    @keyframes cardIn{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
    input:focus,textarea:focus,select:focus{outline:none!important;border-color:${T.lav}!important;box-shadow:0 0 0 3px ${T.lavSoft}!important;}
    select option{background:#fff;color:${T.ink};}
    ::-webkit-scrollbar{width:3px;height:3px;}::-webkit-scrollbar-thumb{background:${T.mutedLight};border-radius:4px;}
    .nb{transition:color .15s;}.nb:hover{color:${T.lav}!important;}
    .ib{transition:background .15s;cursor:pointer;}.ib:hover{background:rgba(0,0,0,.07)!important;}
    .lr:hover{background:rgba(0,0,0,.04)!important;}
    .ph{transition:all .15s;cursor:pointer;}
    .tsc .ph:hover{border-color:${INK}!important;}
    .rb{transition:all .15s;cursor:pointer;}.rb:hover{transform:translateY(-3px) scale(1.05);}
    .cta-bar{pointer-events:none;}.cta-bar button{pointer-events:auto;}
    .cth{transition:all .2s;cursor:pointer;}.cth:hover{transform:translateY(-2px);}.cth:active{transform:translate(3px,3px);box-shadow:2px 2px 0 #16161a!important;}
    .tile{transition:transform .16s ease,box-shadow .16s ease;}
    .tile:hover{transform:translateY(-3px);box-shadow:0 10px 22px rgba(22,22,26,.14);}
    .gcard{box-shadow:${SOFT};transition:transform .18s ease,box-shadow .18s ease;}
    .gcard:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(22,22,26,.17);}
    .pcard .card-actions{opacity:0;transition:opacity .18s;}
    .pcard:hover .card-actions,.pcard:focus-within .card-actions{opacity:1;}
    @media (hover:none){.pcard .card-actions{opacity:1;}}
    @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important;}}
    .flip-wrap{perspective:1400px;}
    .flip-inner{transition:transform .5s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d;position:relative;}
    .flip-inner.on{transform:rotateY(180deg);}
    .face{backface-visibility:hidden;-webkit-backface-visibility:hidden;}
    .face-b{transform:rotateY(180deg);}
    .dz{transition:border-color .2s,background .2s;}.dz:hover{border-color:${T.lav}!important;background:${T.lavLight}44!important;}
    .blink{animation:blink 1.4s ease-in-out infinite;}
    .tsc{overflow-x:auto;-ms-overflow-style:none;scrollbar-width:none;}.tsc::-webkit-scrollbar{display:none;}
    .sp{width:16px;height:16px;border:2px solid rgba(124,111,205,.2);border-top-color:${T.lav};border-radius:50%;animation:spin .7s linear infinite;display:inline-block;}
    .stack-card{animation:cardIn .35s cubic-bezier(.34,1.4,.64,1);}
    .plus-fab{transition:transform .2s,box-shadow .2s;}.plus-fab:hover{transform:translateY(-3px) scale(1.07);box-shadow:0 14px 36px rgba(224,92,154,.4)!important;}
  `;

  // ── AUTH SCREEN ────────────────────────────────────────────────────────────
  if(recovery) return (
    <div style={{minHeight:"100vh",background:T.bg,backgroundImage:GRID,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:24}}>
      <style>{css}</style>
      <div style={{background:T.surface,border:outline(2.5),borderRadius:24,padding:"30px 26px",width:"100%",maxWidth:380,boxShadow:drop(6,6)}}>
        <div style={{fontSize:9,letterSpacing:4,color:T.lav,fontFamily:HEAD,textTransform:"uppercase",marginBottom:5}}>Admin</div>
        {recovery.error?(<>
          <div style={{fontSize:21,fontWeight:800,fontFamily:HEAD,color:INK,letterSpacing:"-.6px",marginBottom:10}}>That link didn't work</div>
          <div style={{fontSize:13,color:T.inkMid,fontFamily:BODY,lineHeight:1.55,marginBottom:18}}>{recovery.error} Reset links expire quickly and only work once. Go back, tap Add phrase, choose "Forgot password?" and try again.</div>
          <button onClick={()=>{ clearHash(); setRecovery(null); }} style={{width:"100%",background:INK,border:outline(),borderRadius:14,color:"#fff",fontFamily:HEAD,fontWeight:800,fontSize:14,padding:14,cursor:"pointer",boxShadow:drop(3,3)}}>Back to the app</button>
        </>):(
          <form onSubmit={submitRecovery} style={{display:"flex",flexDirection:"column",gap:14}}>
            <div style={{fontSize:21,fontWeight:800,fontFamily:HEAD,color:INK,letterSpacing:"-.6px"}}>Set a new password</div>
            <div><label style={lSt}>New password</label><input type="password" value={newPw} onChange={e=>setNewPw(e.target.value)} placeholder="min. 6 characters" required autoFocus style={iSt}/></div>
            <div><label style={lSt}>Type it again</label><input type="password" value={newPw2} onChange={e=>setNewPw2(e.target.value)} placeholder="••••••••" required style={iSt}/></div>
            {recError&&<div style={{fontSize:12,color:"#dc2626",background:"#fee2e2",border:"1px solid #fca5a5",borderRadius:10,padding:"9px 12px"}}>{recError}</div>}
            <button type="submit" disabled={recBusy} style={{background:INK,border:outline(),borderRadius:14,color:"#fff",fontFamily:HEAD,fontWeight:800,fontSize:14,padding:14,cursor:"pointer",boxShadow:drop(3,3),opacity:recBusy?.6:1}}>{recBusy?"Saving…":"Save and sign in →"}</button>
          </form>
        )}
      </div>
    </div>
  );

  if(!session) return (
    <div style={{minHeight:"100vh",background:T.bg,backgroundImage:GRID,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:24}}>
      <style>{css}</style>
      <div style={{textAlign:"center",marginBottom:36}}>
        <img src="logo.png" alt="BiliG" style={{height:76,width:"auto",display:"block",margin:"0 auto"}}/>
        <div style={{fontSize:10,letterSpacing:4,color:T.muted,fontFamily:HEAD,textTransform:"uppercase",marginTop:8}}>Language Diary</div>
      </div>
      <div style={{background:T.surface,border:outline(2.5),borderRadius:24,padding:"32px 28px",width:"100%",maxWidth:380,boxShadow:drop(6,6)}}>
        <div style={{display:"flex",background:T.surfaceHi,borderRadius:14,padding:4,marginBottom:28,gap:4}}>
          {[["login","Log in"],["signup","Sign up"]].map(([v,l])=>(
            <button key={v} onClick={()=>{setAuthView(v);setAuthError("");setAuthSuccess("");}}
              style={{flex:1,background:authView===v?T.lav:"transparent",border:"none",borderRadius:11,padding:"9px",fontFamily:HEAD,fontWeight:700,fontSize:13,color:authView===v?"#fff":T.muted,cursor:"pointer",transition:"all .2s"}}>
              {l}
            </button>
          ))}
        </div>
        <form onSubmit={handleAuth} style={{display:"flex",flexDirection:"column",gap:14}}>
          <div><label style={lSt}>Email</label><input type="email" value={authEmail} onChange={e=>setAuthEmail(e.target.value)} placeholder="you@example.com" required style={iSt}/></div>
          <div><label style={lSt}>Password</label><input type="password" value={authPw} onChange={e=>setAuthPw(e.target.value)} placeholder={authView==="signup"?"min. 6 characters":"••••••••"} required style={iSt}/></div>
          {authError&&<div style={{fontSize:12,color:"#dc2626",background:"#fee2e2",border:"1px solid #fca5a5",borderRadius:10,padding:"9px 12px"}}>{authError}</div>}
          {authSuccess&&<div style={{fontSize:12,color:"#16a34a",background:"#f0fdf4",border:"1px solid #86efac",borderRadius:10,padding:"9px 12px"}}>{authSuccess}</div>}
          <button type="submit" disabled={authLoading} style={{background:T.lav,border:outline(),borderRadius:14,color:"#fff",fontFamily:HEAD,fontWeight:800,fontSize:15,padding:15,cursor:"pointer",marginTop:4,boxShadow:drop(3,3),opacity:authLoading?.7:1}}>
            {authLoading?"…":authView==="login"?"Log in →":"Create account →"}
          </button>
        </form>
        <div style={{display:"flex",alignItems:"center",gap:10,margin:"18px 0 14px"}}>
          <div style={{flex:1,height:1,background:T.border}}/>
          <span style={{fontSize:9,letterSpacing:2,color:T.mutedLight,fontFamily:HEAD,textTransform:"uppercase"}}>or</span>
          <div style={{flex:1,height:1,background:T.border}}/>
        </div>
        <button type="button" onClick={enterGuest}
          style={{width:"100%",background:T.surface,border:outline(),borderRadius:14,color:INK,fontFamily:HEAD,fontWeight:800,fontSize:14,padding:14,cursor:"pointer",boxShadow:drop(3,3)}}>
          Skip — continue as guest →
        </button>
        <div style={{marginTop:20,fontSize:11,color:T.muted,textAlign:"center",fontFamily:BODY,lineHeight:1.6}}>Your phrases are private and encrypted.<br/>Guest phrases stay on this device only.</div>
      </div>
    </div>
  );

  // ── MAIN APP ───────────────────────────────────────────────────────────────
  const greeting = getGreeting();
  const firstName = session.user?.email?.split("@")[0] || "";

  return (
    <div style={{minHeight:"100vh",background:T.bg,backgroundImage:GRID,color:T.ink,overflowX:"hidden",position:"relative"}}>
      <style>{css}</style>

      {/* Photo pickers — mounted once so any view can open them */}
      <input ref={camRef}  type="file" accept="image/*" capture="environment" style={{display:"none"}} onChange={e=>{startScan(e.target.files[0]);e.target.value="";}}/>
      <input ref={fileRef} type="file" accept="image/*" style={{display:"none"}} onChange={e=>{startScan(e.target.files[0]);e.target.value="";}}/>

      {toast&&<div style={{position:"fixed",top:18,left:"50%",transform:"translateX(-50%)",background:toast.type==="error"?"#fee2e2":toast.type==="info"?"#ede9ff":"#f0fdf4",color:toast.type==="error"?"#991b1b":toast.type==="info"?T.lav:"#166534",padding:"9px 20px",borderRadius:30,zIndex:999,fontSize:13,fontFamily:BODY,boxShadow:"0 4px 24px rgba(0,0,0,.1)",animation:"fadeDown .25s ease",whiteSpace:"nowrap",border:`1px solid ${toast.type==="error"?"#fca5a5":toast.type==="info"?T.lavBorder:"#86efac"}`}}>{toast.msg}</div>}

      {/* ── Reminder: phrases waiting on standby ── */}
      {!readOnly&&view==="library"&&bulkRows.length>0&&(<>
        <div style={{height:isDesktop?46:44}}/>
        <div role="status" style={{position:"fixed",top:0,left:0,right:0,height:isDesktop?46:44,zIndex:120,background:T.lavLight,borderBottom:outline(2),display:"flex",alignItems:"center",justifyContent:"center",gap:10,padding:"0 12px",fontFamily:BODY,fontSize:12.5,color:INK}}>
          <span style={{flexShrink:0}}>🗂</span>
          <span style={{fontWeight:600,minWidth:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{bulkRows.length} phrase{bulkRows.length===1?"":"s"} on standby</span>
          <button onClick={openBulk} style={{flexShrink:0,background:INK,color:"#fff",border:"none",borderRadius:9,padding:"4px 11px",fontSize:12,fontWeight:600,fontFamily:BODY,cursor:"pointer"}}>Finish them</button>
          <button onClick={()=>setIgnoreAsk("all")} style={{flexShrink:0,background:"transparent",color:INK,border:`1px solid ${T.borderMid}`,borderRadius:9,padding:"4px 11px",fontSize:12,fontWeight:600,fontFamily:BODY,cursor:"pointer"}}>Ignore all</button>
        </div>
      </>)}

      {/* ── HEADER ── */}
      <div style={{...shell,position:"relative",zIndex:10,padding:isDesktop?"26px 40px 0":"18px 22px 0",display:"grid",gridTemplateColumns:isDesktop?"1fr auto 1fr":"1fr auto",alignItems:"center",gap:16}}>
        {isDesktop?(<>
          {/* Time-based greeting */}
          <div style={{fontSize:13,color:T.muted,fontFamily:BODY,letterSpacing:"-0.2px"}}>
            {greeting}{firstName&&<>, <span style={{color:T.inkMid,fontWeight:500}}>{firstName}</span></>} 👋
          </div>
          <img src="logo.png" alt="BiliG" style={{height:56,width:"auto",display:"block"}}/>
        </>):(
          <div>
            <img src="logo.png" alt="BiliG" style={{height:32,width:"auto",display:"block"}}/>
            <div style={{fontSize:11,color:T.muted,fontFamily:BODY,marginTop:3,letterSpacing:"-0.2px"}}>
              {greeting}{firstName&&<>, <span style={{color:T.inkMid,fontWeight:500}}>{firstName}</span></>} 👋
            </div>
          </div>
        )}

        {/* Settings + language dropdown */}
        <div style={{display:"flex",alignItems:"center",gap:10,justifySelf:"end"}}>
        <button onClick={()=>readOnly?askAdmin("settings"):openSettings()} aria-label="Settings" title="Settings"
          style={{width:38,height:38,borderRadius:"50%",background:T.surface,border:outline(),color:INK,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",boxShadow:drop(3,3),flexShrink:0}}><IconGear size={18}/></button>
        <div ref={langRef} style={{position:"relative"}}>
          <button onClick={()=>setLangOpen(o=>!o)} style={{background:T.surface,border:outline(),borderRadius:30,padding:"8px 16px 8px 12px",color:INK,fontFamily:BODY,fontWeight:600,fontSize:12,cursor:"pointer",display:"flex",alignItems:"center",gap:7,boxShadow:drop(3,3)}}>
            <span style={{fontSize:14}}>{getLang(activeLang).flag}</span>
            <span style={{color:T.ink,fontWeight:500,fontSize:12}}>{activeLang}</span>
            <span style={{fontSize:8,color:T.muted}}>{langOpen?"▲":"▼"}</span>
          </button>
          {langOpen&&(
            <div style={{position:"absolute",right:0,top:"calc(100% + 10px)",background:T.surface,border:outline(),borderRadius:16,padding:"6px",minWidth:172,zIndex:200,boxShadow:drop(4,4),animation:"pop .15s ease"}}>
              {LANGUAGES.map(l=>(
                <div key={l.name} className="lr" onClick={()=>{setActiveLang(l.name);setLangOpen(false);}}
                  style={{display:"flex",alignItems:"center",gap:9,padding:"8px 10px",borderRadius:10,cursor:"pointer",transition:"background .12s",background:"transparent"}}>
                  <span style={{fontSize:14}}>{l.flag}</span>
                  <span style={{fontSize:13,fontFamily:BODY,color:activeLang===l.name?T.lav:T.ink,fontWeight:activeLang===l.name?600:400}}>{l.name}</span>
                  {activeLang===l.name&&<span style={{marginLeft:"auto",color:T.lav,fontSize:12}}>✓</span>}
                </div>
              ))}
              {!readOnly&&<div style={{borderTop:`1px solid ${T.border}`,marginTop:4,paddingTop:4}}>
                {isGuest&&(
                  <div className="lr" onClick={()=>{setLangOpen(false);setAuthView("signup");logout();}} style={{display:"flex",alignItems:"center",gap:9,padding:"8px 10px",borderRadius:10,cursor:"pointer",transition:"background .12s",background:"transparent"}}>
                    <span>✨</span><span style={{fontSize:12,fontFamily:BODY,color:T.lav,fontWeight:600}}>Sign up to sync</span>
                  </div>
                )}
                <div className="lr" onClick={logout} style={{display:"flex",alignItems:"center",gap:9,padding:"8px 10px",borderRadius:10,cursor:"pointer",transition:"background .12s",background:"transparent"}}>
                  <span>🚪</span><span style={{fontSize:12,fontFamily:BODY,color:T.muted}}>{isGuest?"Exit guest mode":"Log out"}</span>
                </div>
              </div>}
            </div>
          )}
        </div>
        </div>
      </div>

      {/* ══ LIBRARY ══ */}
      {view==="library"&&(
        <div style={{...shell,padding:isDesktop?"20px 40px 130px":"14px 22px 140px",animation:"up .3s ease",position:"relative",zIndex:1}}>

          {/* Stats: one bar, three cells */}
          <div style={{display:"flex",maxWidth:isDesktop?760:"none",margin:isDesktop?"0 auto 22px":"0 0 18px",background:T.surface,border:outline(),borderRadius:isDesktop?20:16}}>
            {[
              {label:"streak",  val:streak,   sub:"day"},
              {label:"mastered",val:mastered, sub:`/ ${phrases.filter(p=>p.language===activeLang).length}`},
              {label:"accuracy",val:`${accuracy}%`, sub:""},
            ].map((s,i)=>(
              <div key={s.label} style={{flex:1,minWidth:0,display:"flex",alignItems:"center",justifyContent:"center",gap:isDesktop?14:7,padding:isDesktop?"14px 18px":"10px 6px",borderLeft:i?`1px solid ${T.border}`:"none"}}>
                <StatIcon kind={s.label} size={isDesktop?40:26}/>
                <div style={{minWidth:0}}>
                  <div style={{fontSize:isDesktop?26:19,fontWeight:800,color:INK,lineHeight:1,fontFamily:HEAD,whiteSpace:"nowrap"}}>
                    {s.val}{s.sub&&<span style={{fontSize:isDesktop?13:10,color:T.inkMid,fontWeight:600,marginLeft:4,fontFamily:BODY}}>{s.sub}</span>}
                  </div>
                  <div style={{fontSize:isDesktop?11:9,color:T.inkMid,fontFamily:BODY,marginTop:3,whiteSpace:"nowrap"}}>{s.label}</div>
                </div>
              </div>
            ))}
          </div>

          {/* Phrases saved only on this device: offer to move them into the shared library */}
          {deviceCount>0&&!deviceHide&&(
            <div style={{border:outline(),borderRadius:16,background:"#fff4d6",boxShadow:drop(3,3),padding:"14px 16px",marginBottom:18}}>
              <div style={{fontSize:14,fontWeight:800,fontFamily:HEAD,color:INK,marginBottom:4}}>📥 {deviceCount} phrase{deviceCount>1?"s are":" is"} saved only on this device</div>
              <div style={{fontSize:12,color:T.inkMid,fontFamily:BODY,lineHeight:1.5,marginBottom:12}}>Add {deviceCount>1?"them":"it"} to the shared library so everyone can see {deviceCount>1?"them":"it"}. The copy on this device is kept as a backup.</div>
              <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
                <button onClick={importDevice} disabled={deviceBusy}
                  style={{background:INK,border:outline(),borderRadius:12,color:"#fff",fontFamily:HEAD,fontWeight:800,fontSize:13,padding:"11px 18px",cursor:"pointer",boxShadow:drop(3,3),opacity:deviceBusy?.6:1}}>{deviceBusy?"Adding…":`Add ${deviceCount} to the library`}</button>
                <button onClick={()=>setDeviceHide(true)} disabled={deviceBusy}
                  style={{background:"transparent",border:`1px solid ${T.borderMid}`,borderRadius:12,color:T.muted,fontFamily:BODY,fontSize:13,padding:"11px 16px",cursor:"pointer"}}>Not now</button>
              </div>
            </div>
          )}

          {/* ══ HOME: word of the day, then the categories ══ */}
          {libTab==="home"&&(()=>{
            const w=wotd, art=w?wordArt[w.id]:null, scene=sceneFor(w), wl=w&&getLang(w.language), ws=w&&getTopicStyle(w.topic), wt=w&&getTopic(w.topic), flip=!!(wl&&wl.rtl);   // flip: Arabic reads right to left, so the text sits on the right and the picture on the left
            const wlen=w?(w.foreign_text||"").length:0, wsize=Math.round((isDesktop?84:54)*(wlen>28?.5:wlen>16?.68:wlen>9?.84:1));
            const tiles=topicList.filter(t=>t.id!=="All").map(t=>({...t,n:phrases.filter(x=>x.language===activeLang&&x.topic===t.id).length})).filter(t=>t.n>0);
            return (<>
              <div {...(daily.length>1?heroSwipe:{})} style={{position:"relative",background:"#6fa8f0",border:outline(),borderRadius:22,padding:isDesktop?"30px 36px":"20px 18px 22px",overflow:"hidden",marginBottom:isDesktop?34:26,minHeight:isDesktop?300:262,cursor:daily.length>1?"grab":"default",userSelect:"none"}}>
                {w?(<>
                  <div style={{position:"relative",zIndex:2,width:flip?(isDesktop?"42%":"50%"):(isDesktop?"56%":"54%"),marginLeft:flip?"auto":0,textAlign:flip?"right":"left"}}>
                    <div style={{fontSize:11,letterSpacing:3,fontFamily:BODY,fontWeight:600,textTransform:"uppercase",color:INK}}>{kindOf(w)} of the day</div>
                    <div dir={wl.rtl?"rtl":"ltr"} style={{fontFamily:wl.rtl?wl.font:HEAD,fontWeight:wl.rtl?700:800,fontSize:wsize,lineHeight:wl.rtl?1.4:1.1,textAlign:wl.rtl?"right":"left",width:"100%",color:INK,overflowWrap:"anywhere",marginTop:6}}>{w.foreign_text}</div>
                    {w.notes&&<div style={{fontFamily:BODY,fontWeight:300,letterSpacing:".2px",fontSize:isDesktop?20:16,color:INK,marginTop:wl.rtl?0:4,textAlign:wl.rtl?"right":"left"}}>{w.notes}</div>}
                    <div style={{fontSize:12,fontFamily:BODY,color:INK,opacity:.75,marginTop:isDesktop?18:12}}>Meaning</div>
                    <div style={{display:"flex",alignItems:"center",gap:"4px 10px",flexWrap:"wrap",justifyContent:flip?"flex-end":"flex-start"}}>
                      <div style={{fontFamily:HEAD,fontWeight:800,fontSize:isDesktop?40:28,lineHeight:1.05,color:INK,overflowWrap:"anywhere"}}>{w.native_text}</div>
                      <span style={{fontSize:10.5,padding:"1px 8px",borderRadius:999,border:"1px solid rgba(22,22,26,.22)",color:"rgba(22,22,26,.62)",fontFamily:BODY,fontWeight:500,whiteSpace:"nowrap"}}>{wt.label}</span>
                    </div>
                    {daily.length>1&&(
                      <div style={{display:"flex",gap:8,marginTop:isDesktop?22:16,justifyContent:flip?"flex-end":"flex-start"}}>
                        {daily.map((d,i)=>(
                          <button key={d.id} onClick={()=>setDailyIdx(i)} aria-label={`Show the ${kindOf(d).toLowerCase()} of the day`} aria-current={i===dailyIdx}
                            style={{width:i===dailyIdx?26:10,height:10,borderRadius:99,padding:0,background:i===dailyIdx?INK:"transparent",border:outline(1.5),cursor:"pointer",transition:"width .2s"}}/>
                        ))}
                      </div>
                    )}
                  </div>
                  {/* the "photo": a tilted print of an illustrated street, with the word's category as a sticker on it */}
                  <div style={{position:"absolute",[flip?"left":"right"]:isDesktop?44:-14,top:isDesktop?32:28,width:isDesktop?250:(flip?"44%":"46%"),height:isDesktop?330:"82%",zIndex:1}}>
                    {/* a fan of three plain ink lines off the photo's corner */}
                    <svg aria-hidden="true" viewBox="0 0 64 56" style={{position:"absolute",[flip?"right":"left"]:isDesktop?-58:-43,top:isDesktop?-50:-37,width:isDesktop?64:48,height:isDesktop?56:42,zIndex:2,overflow:"visible",transform:flip?"scaleX(-1)":"none"}} fill="none" strokeLinecap="round">
                      <g stroke={INK} strokeWidth="3"><path d="M45 46.5 L28 40.4"/><path d="M50.8 38.9 L38.2 20.9"/><path d="M60 36 L60 18"/></g>
                    </svg>
                    {art?(
                      <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",zIndex:1}}>
                        <WordArt emoji={art} onFail={()=>setWordArt(m=>({...m,[w.id]:null}))} style={{width:"88%",height:"auto",transform:`rotate(${flip?-6:6}deg)`}}/>
                      </div>
                    ):(
                      <img src={scene||CITY_SCENE} alt="" aria-hidden="true" style={{position:"absolute",inset:0,width:"100%",height:"100%",objectFit:"contain",display:"block",zIndex:1}}/>
                    )}
                  </div>
                </>):(
                  <div style={{position:"relative",zIndex:2,maxWidth:420}}>
                    <div style={{fontSize:11,letterSpacing:3,fontFamily:BODY,fontWeight:600,textTransform:"uppercase",color:INK}}>Word of the day</div>
                    <div style={{fontFamily:HEAD,fontWeight:800,fontSize:isDesktop?38:28,lineHeight:1.05,color:INK,marginTop:10}}>{phrases.length?`No ${activeLang} phrases yet`:readOnly?"Nothing here yet":"Add your first phrase"}</div>
                    <div style={{fontFamily:BODY,fontSize:13,color:INK,opacity:.8,marginTop:8}}>{readOnly?"Check back soon.":"A word of the day appears here once you have some phrases."}</div>
                  </div>
                )}
              </div>

              {w&&wordArt&&<div style={{fontSize:10,color:T.muted,fontFamily:BODY,textAlign:"right",margin:isDesktop?"-24px 4px 22px":"-18px 4px 16px"}}>Picture: <a href="https://openmoji.org" target="_blank" rel="noopener" style={{color:"inherit"}}>OpenMoji</a> · CC BY-SA 4.0</div>}
              {tiles.length>0&&(<>
                <div style={{fontFamily:HEAD,fontWeight:800,fontSize:isDesktop?34:30,letterSpacing:"-.4px",color:INK,margin:"0 0 14px"}}>Explore by category</div>
                <div style={{display:"grid",gridTemplateColumns:isDesktop?"repeat(3,1fr)":"repeat(2,1fr)",gap:isDesktop?18:12}}>
                  {tiles.map((t,i)=>(
                    <button key={t.id} className="tile" onClick={()=>{ setTopicFilter(t.id); setLibTab("cards"); }}
                      style={{position:"relative",textAlign:"left",background:getTopicStyle(t.id).bg,border:"none",borderRadius:18,padding:isDesktop?"16px 18px":"12px 12px",minHeight:isDesktop?148:120,cursor:"pointer",overflow:"visible",display:"flex",flexDirection:"column",justifyContent:"space-between",fontFamily:BODY,color:INK}}>
                      {/* the outline: a plain rounded border, smooth at any tile size, same stroke weight as every other outline */}
                      <div aria-hidden="true" style={{position:"absolute",inset:0,border:outline(),borderRadius:18,pointerEvents:"none",zIndex:3}}/>
                      <div style={{position:"relative",zIndex:2,maxWidth:"62%"}}>
                        <div style={{fontFamily:HEAD,fontWeight:800,fontSize:isDesktop?26:20,lineHeight:1.05,letterSpacing:"-.2px",overflowWrap:"anywhere"}}>{t.label}</div>
                        {TOPIC_AR[t.id]&&<div dir="rtl" style={{fontFamily:"'Scheherazade New',serif",fontSize:isDesktop?18:15,color:"rgba(22,22,26,.65)",marginTop:2}}>{TOPIC_AR[t.id]}</div>}
                      </div>
                      <div aria-hidden="true" style={{position:"absolute",right:isDesktop?14:10,top:isDesktop?14:10,width:isDesktop?96:70,height:isDesktop?96:70,transform:`rotate(${(t.n%2?6:-6)}deg)`,filter:"url(#sticker)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:isDesktop?58:40}}>
                        {hasTopicSvg(t.id)?<TopicArt topic={t.id}/>:t.icon}
                      </div>
                      <div style={{position:"relative",zIndex:2,display:"flex",alignItems:"center",justifyContent:"space-between",gap:8}}>
                        <span style={{background:"#fff",border:outline(1.5),borderRadius:999,padding:"4px 12px",fontSize:isDesktop?12:11,fontWeight:600}}>{t.n} phrase{t.n===1?"":"s"}</span>
                        <span aria-hidden="true" style={{width:isDesktop?34:30,height:isDesktop?34:30,borderRadius:"50%",background:"#fff",border:outline(1.5),display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke={INK} strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><path d="M9 5l7 7-7 7"/></svg>
                        </span>
                      </div>
                    </button>
                  ))}
                </div>
              </>)}
            </>);
          })()}

          {/* ══ FLASHCARD MODE: the card library ══ */}
          {libTab==="cards"&&(<>
          <button onClick={()=>{ setLibTab("home"); setTopicFilter("All"); setKindFilter("All"); }}
            style={{background:"none",border:"none",color:T.inkMid,fontFamily:BODY,fontWeight:600,fontSize:13,cursor:"pointer",padding:"0 0 12px",display:"flex",alignItems:"center",gap:6}}>← Home</button>
          {/* Topic filter chips — one tight row that scrolls sideways */}
          <div style={{marginBottom:isDesktop?16:20}}>
            <div className="tsc" style={{display:"flex",gap:5,paddingBottom:isDesktop?6:2,flexWrap:"nowrap",overflowX:"auto",justifyContent:"flex-start",scrollbarWidth:isDesktop?"thin":"none"}}>
              {topicList.map(t=>{
                const active=topicFilter===t.id;
                const count=t.id==="All"?phrases.filter(p=>p.language===activeLang).length:(phrases.filter(p=>p.language===activeLang&&p.topic===t.id).length);
                return (
