                  <div key={t.id} className="ph" onClick={()=>setTopicFilter(t.id)}
                    style={{flexShrink:0,display:"flex",alignItems:"center",gap:isDesktop?5:4,padding:isDesktop?"7px 11px":"6px 10px",borderRadius:30,background:t.id==="All"?(active?INK:"transparent"):getTopicStyle(t.id).bg,border:`${active?1.8:1}px solid ${t.id==="All"&&!active?T.borderMid:INK}`,transition:"all .15s"}}>
                    <span style={{fontSize:isDesktop?14:11,lineHeight:1,opacity:active?1:.8}}>{t.icon}</span>
                    <span style={{fontSize:isDesktop?13:11,fontFamily:BODY,fontWeight:active?700:500,color:active&&t.id==="All"?"#fff":INK,whiteSpace:"nowrap"}}>{t.label}</span>
                    <span style={{fontSize:isDesktop?10:7,color:active&&t.id==="All"?"rgba(255,255,255,.6)":T.inkMid,marginLeft:isDesktop?2:1,fontFamily:BODY}}>{count}</span>
                  </div>
                );
              })}
            </div>
          </div>

          {/* Word / Phrase */}
          <div style={{display:"flex",gap:6,marginBottom:isDesktop?14:12,flexWrap:"wrap"}}>
            {["All",...KINDS].map(k=>{
              const inScope=phrases.filter(p=>p.language===activeLang&&(topicFilter==="All"||p.topic===topicFilter));
              const n=k==="All"?inScope.length:inScope.filter(p=>kindOf(p)===k).length, on=kindFilter===k;
              return (
                <button key={k} onClick={()=>setKindFilter(k)} aria-pressed={on}
                  style={{background:on?INK:"transparent",color:on?"#fff":INK,border:`1px solid ${on?INK:T.borderMid}`,borderRadius:999,padding:isDesktop?"5px 13px":"4px 11px",cursor:"pointer",fontFamily:BODY,fontWeight:on?700:500,fontSize:isDesktop?12:11}}>
                  {k==="All"?"All types":k+"s"} <span style={{opacity:.6,fontSize:isDesktop?10:9}}>{n}</span>
                </button>
              );
            })}
          </div>

          {/* Card count */}
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
            <div style={{fontSize:9,color:T.muted,fontFamily:HEAD,letterSpacing:1,textTransform:"uppercase",display:"flex",alignItems:"center",gap:8}}>
              {dbLoading?<span className="sp"/>:`${filtered.length} phrase${filtered.length!==1?"s":""}`}
            </div>
            <div style={{display:"flex",alignItems:"center",gap:12}}>
              {filtered.length>0&&deckMode&&<div style={{fontSize:9,color:T.muted,fontFamily:BODY}}>{stackIdx+1} / {filtered.length}</div>}
              {isDesktop&&filtered.length>0&&(
                <div style={{display:"flex",background:T.surfaceHi,border:outline(),borderRadius:12,padding:3,gap:3,boxShadow:drop(2,2)}}>
                  {[["deck","🂠","Deck"],["grid","▦","Grid"]].map(([m,icon,label])=>(
                    <button key={m} onClick={()=>setLibMode(m)} title={`${label} view`} aria-pressed={libMode===m}
                      style={{display:"flex",alignItems:"center",gap:5,background:libMode===m?INK:"transparent",border:"none",borderRadius:9,padding:"5px 11px",cursor:"pointer",fontFamily:BODY,fontWeight:600,fontSize:11,color:libMode===m?"#fff":T.muted,transition:"all .15s"}}>
                      <span style={{fontSize:11}}>{icon}</span><span>{label}</span>
                    </button>
                  ))}
                </div>
              )}
            </div>
          </div>

          {/* ── CARDS — the centre of the app ── */}
          {filtered.length===0&&!dbLoading&&(
            <div style={{textAlign:"center",padding:isDesktop?"80px 0":"60px 0",color:T.muted}}>
              <div style={{fontSize:40,marginBottom:14}}>🌿</div>
              <div style={{fontFamily:HEAD,fontSize:isDesktop?21:17,fontWeight:700,color:T.ink,marginBottom:6}}>{readOnly?"Nothing to show yet":"Start your diary"}</div>
              <div style={{fontFamily:BODY,fontSize:13,color:T.muted,marginBottom:phrases.length?0:20}}>
                {phrases.length?`No ${activeLang} phrases here yet`:readOnly?"The shared library is empty right now":"Add your first phrase, or begin with five common ones"}
              </div>
              {!phrases.length&&!readOnly&&(
                <button onClick={addStarters} disabled={seeding}
                  style={{background:"#ffd97a",border:outline(),borderRadius:14,color:INK,fontFamily:HEAD,fontWeight:800,fontSize:13,padding:"12px 22px",cursor:"pointer",boxShadow:drop(3,3),opacity:seeding?.6:1}}>
                  {seeding?"adding…":"✨ Add 5 starter phrases"}
                </button>
              )}
            </div>
          )}

          {/* Grid — every card at once (desktop, opt-in) */}
          {filtered.length>0&&!deckMode&&(
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(250px,1fr))",gap:16,alignItems:"stretch"}}>
              {filtered.map(p=>(
                <PhraseCard key={p.id} p={p} compact className="gcard"
                  onEdit={readOnly?undefined:openEdit} onDelete={readOnly?undefined:setDelConfirm}/>
              ))}
            </div>
          )}

          {/* Deck — one card at a time, swipe or drag through it */}
          {filtered.length>0&&deckMode&&(
            <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:isDesktop?40:0}}>
            {isDesktop&&<DeckArrow dir="left" disabled={stackIdx===0} onClick={()=>setStackIdx(i=>Math.max(0,i-1))}/>}
            <div style={{position:"relative",height:deckH,width:"100%",maxWidth:isDesktop?540:"none"}}>
              {[2,1].map(offset=>{
                if(stackIdx+offset>=filtered.length)return null;
                return (
                  <div key={offset} aria-hidden="true" style={{position:"absolute",left:`${offset*3}%`,right:`${offset*3}%`,top:`${offset*11}px`,background:T.surfaceHi,borderRadius:26,height:deckH-40,border:outline(),opacity:offset===1?.9:.55,transform:`rotate(${offset===1?1.5:-1.2}deg)`,pointerEvents:"none"}}/>
                );
              })}
              {[["prev",-1,prevRef],["next",1,nextRef]].map(([k,step,ref])=>filtered[stackIdx+step]&&(
                <div key={`${k}${stackIdx}`} ref={ref} aria-hidden="true" style={{position:"absolute",inset:0,opacity:0,transform:"scale(.94) translateY(12px)",pointerEvents:"none"}}>
                  <PhraseCard p={filtered[stackIdx+step]} classic style={{position:"absolute",inset:0,boxShadow:"0 16px 40px rgba(26,24,37,.16)"}}/>
                </div>
              ))}
              {filtered[stackIdx]&&(
                <div key={`top${stackIdx}`} ref={topRef} data-deck-top="1"
                  style={{position:"absolute",inset:0,touchAction:"pan-y",cursor:"grab",userSelect:"none",WebkitUserSelect:"none",transformOrigin:"50% 110%",willChange:"transform"}}
                  onPointerDown={deckDown} onPointerMove={deckMove} onPointerUp={deckUp} onPointerCancel={deckUp}>
                  <PhraseCard p={filtered[stackIdx]} classic className={justSwiped.current?"":"stack-card"}
                    onEdit={readOnly?undefined:openEdit} onDelete={readOnly?undefined:setDelConfirm}
                    style={{position:"absolute",inset:0,boxShadow:"0 24px 64px rgba(26,24,37,.22)"}}/>
                </div>
              )}
            </div>
            {isDesktop&&<DeckArrow dir="right" disabled={stackIdx>=filtered.length-1} onClick={()=>setStackIdx(i=>Math.min(filtered.length-1,i+1))}/>}
            </div>
          )}

          {/* Mobile: arrows + dots under the card */}
          {filtered.length>1&&deckMode&&!isDesktop&&(
            <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:14,marginTop:18}}>
              <button onClick={()=>setStackIdx(i=>Math.max(0,i-1))} disabled={stackIdx===0}
                style={{background:T.surface,border:outline(),borderRadius:50,width:38,height:38,display:"flex",alignItems:"center",justifyContent:"center",cursor:stackIdx===0?"default":"pointer",opacity:stackIdx===0?.25:1,fontSize:14,color:INK,boxShadow:drop(2,2),transition:"opacity .2s",fontFamily:BODY}}>←</button>
              <div style={{display:"flex",gap:5,flexWrap:"wrap",justifyContent:"center",maxWidth:180}}>
                {filtered.map((_,i)=><div key={i} onClick={()=>setStackIdx(i)} style={{width:i===stackIdx?16:5,height:5,borderRadius:5,background:i===stackIdx?T.dark:T.borderMid,transition:"all .25s",cursor:"pointer"}}/>)}
              </div>
              <button onClick={()=>setStackIdx(i=>Math.min(filtered.length-1,i+1))} disabled={stackIdx===filtered.length-1}
                style={{background:T.surface,border:outline(),borderRadius:50,width:38,height:38,display:"flex",alignItems:"center",justifyContent:"center",cursor:stackIdx===filtered.length-1?"default":"pointer",opacity:stackIdx===filtered.length-1?.25:1,fontSize:14,color:INK,boxShadow:drop(2,2),transition:"opacity .2s",fontFamily:BODY}}>→</button>
            </div>
          )}
          </>)}
        </div>
      )}

      {/* ══ FLASHCARD ══ */}
      {view==="flashcard"&&(
        <div style={{...shell,padding:isDesktop?"32px 40px 60px":"20px 22px 120px",display:"flex",flexDirection:"column",alignItems:"center",animation:"up .3s ease",position:"relative",zIndex:1}}>
          <div style={{width:"100%",maxWidth:isDesktop?540:460,display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
            <div style={{fontSize:9,color:T.muted,fontFamily:HEAD,letterSpacing:1.5,textTransform:"uppercase"}}>{practiceMode==="due"?`⚡ Review · ${reviewRead().seen.length}/${REVIEW_DAILY} words · ${reviewRead().right}/${REVIEW_RIGHT} right`:`🃏 Practice · ${cardIndex+1}/${cardDeck.length}`}</div>
            <button onClick={()=>setView("library")} className="nb" style={{background:"none",border:"none",color:T.muted,cursor:"pointer",fontFamily:BODY,fontSize:12}}>✕ exit</button>
          </div>
          <div style={{width:"100%",maxWidth:isDesktop?540:460,height:3,background:T.border,borderRadius:2,marginBottom:28}}>
            <div style={{height:"100%",borderRadius:2,background:`linear-gradient(90deg,${T.lav},${T.pink})`,width:`${((cardIndex+1)/cardDeck.length)*100}%`,transition:"width .4s ease"}}/>
          </div>
          <div className="flip-wrap" style={{width:"100%",maxWidth:isDesktop?540:460,height:isDesktop?330:275,cursor:"pointer"}} onClick={handleFlip}>
            <div className={`flip-inner${flipped?" on":""}`} style={{width:"100%",height:"100%"}}>
              <div className="face" style={{position:"absolute",width:"100%",height:"100%",background:getTopicStyle(fcard?.topic).bg,border:outline(2.5),borderRadius:24,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:32,boxSizing:"border-box",boxShadow:drop(6,6)}}>
                <div style={{fontFamily:SERIF,fontStyle:"italic",fontSize:15,color:"rgba(22,22,26,.62)",marginBottom:18}}>{fcard?getTopic(fcard.topic).label:""}</div>
                <div dir={fcardLang?.rtl?"rtl":"ltr"} style={{fontSize:fcardLang?.rtl?54:40,fontFamily:fcardLang?.rtl?fcardLang?.font:DISPLAY,textAlign:"center",lineHeight:fcardLang?.rtl?1.35:1,width:"100%",color:INK,fontWeight:fcardLang?.rtl?700:400}}>{fcard?.foreign_text}</div>
                {fcardTag&&<div style={{marginTop:20,fontSize:11,padding:"4px 14px",borderRadius:20,background:fcardTag.color,color:INK,fontFamily:HEAD,fontWeight:800,letterSpacing:.5,textTransform:"uppercase",border:outline(2),boxShadow:drop(2,2)}}>{fcardTag.label}</div>}
                <div style={{marginTop:24,fontSize:10,color:"rgba(22,22,26,.5)",fontFamily:BODY}}>tap to reveal</div>
              </div>
              <div className="face face-b" style={{position:"absolute",width:"100%",height:"100%",background:T.surface,border:outline(2.5),borderRadius:24,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:32,boxSizing:"border-box",boxShadow:drop(6,6)}}>
                <div style={{fontSize:9,letterSpacing:2.5,color:T.muted,fontFamily:HEAD,fontWeight:700,textTransform:"uppercase",marginBottom:14}}>Meaning</div>
                <div style={{fontSize:30,textAlign:"center",color:INK,fontFamily:HEAD,fontWeight:800,lineHeight:1.15,letterSpacing:"-.5px"}}>{fcard?.native_text}</div>
                {fcard?.notes&&<div style={{marginTop:14,fontSize:15,color:T.inkMid,fontFamily:BODY,fontWeight:300,textAlign:"center",lineHeight:1.4}}>{fcard.notes}</div>}
              </div>
            </div>
          </div>
          <div style={{marginTop:24,width:"100%",maxWidth:isDesktop?540:460,opacity:showRating?1:0,transform:showRating?"translateY(0)":"translateY(8px)",transition:"all .3s ease",pointerEvents:showRating?"auto":"none"}}>
            <div style={{fontSize:9,color:T.muted,fontFamily:HEAD,letterSpacing:2,textAlign:"center",marginBottom:10,textTransform:"uppercase"}}>How did you do?</div>
            <div style={{display:"flex",gap:8}}>
              {[{label:"Again",emoji:"😓",rating:0,color:"#dc2626",bg:"#fee2e2",bc:"#fca5a5",sub:"Tomorrow"},{label:"Good",emoji:"🙂",rating:1,color:"#ea580c",bg:"#fff7ed",bc:"#fdba74",sub:"Few days"},{label:"Easy",emoji:"🚀",rating:2,color:"#16a34a",bg:"#f0fdf4",bc:"#86efac",sub:"10+ days"}].map(({label,emoji,rating,color,bg,bc,sub})=>(
                <button key={rating} className="rb" onClick={()=>handleRating(rating)} style={{flex:1,background:bg,border:outline(),borderRadius:16,padding:"13px 6px",display:"flex",flexDirection:"column",alignItems:"center",gap:4,boxShadow:drop(3,3),cursor:"pointer"}}>
                  <span style={{fontSize:20}}>{emoji}</span>
                  <span style={{fontSize:12,fontFamily:HEAD,fontWeight:700,color}}>{label}</span>
                  <span style={{fontSize:9,fontFamily:BODY,color:T.muted}}>{sub}</span>
                </button>
              ))}
            </div>
          </div>
          {!showRating&&<div style={{marginTop:18,fontSize:10,color:T.mutedLight,fontFamily:BODY}}>Tap the card to reveal</div>}
        </div>
      )}

      {/* ══ SCAN REVIEW ══ */}
      {view==="scan"&&(
        <div style={{padding:isDesktop?"30px 40px 60px":"20px 22px 40px",animation:"up .3s ease",maxWidth:isDesktop?720:560,marginLeft:isDesktop?"auto":0,marginRight:isDesktop?"auto":0,position:"relative",zIndex:1}}>
          <div style={{fontSize:9,letterSpacing:4,color:T.lav,fontFamily:HEAD,textTransform:"uppercase",marginBottom:5}}>From your photo</div>
          <div style={{fontSize:isDesktop?26:22,fontWeight:800,fontFamily:HEAD,marginBottom:18,color:INK,letterSpacing:"-.8px"}}>
            {scanRows.length?`Found ${scanRows.length} phrase${scanRows.length>1?"s":""}`
              :(scanBusy||linesBusy)&&!scanLines.length?"Reading the photo…"
              :scanLines.length?"Here's what it read":"Nothing found"}
          </div>

          {imgPreview&&(
            <div style={{display:"flex",gap:14,alignItems:"flex-start",marginBottom:18}}>
              <img src={imgPreview} alt="The photo you scanned" style={{width:96,height:96,objectFit:"cover",borderRadius:14,border:outline(),boxShadow:drop(3,3)}}/>
              <div style={{fontSize:12,color:T.muted,fontFamily:SERIF,fontStyle:"italic",lineHeight:1.5,paddingTop:4}}>
                Untick anything you don't want, fix any misread text, then add them to your diary.
                <br/>✨ marks a translation written by the scanner rather than read off the page.
              </div>
            </div>
          )}

          {scanBusy&&!scanRows.length&&(
            <div className="blink" style={{fontSize:13,color:T.lav,fontFamily:BODY,padding:"4px 0 16px"}}>✨ Picking out phrases and translations…</div>
          )}

          {scanError&&(
            <div style={{fontSize:13,color:"#991b1b",background:"#fee2e2",border:outline(1.5),borderRadius:12,padding:"12px 14px",fontFamily:BODY,marginBottom:18}}>{scanError}</div>
          )}
          {scanNote&&!scanError&&(
            <div style={{fontSize:13,color:INK,background:"#fff4d6",border:outline(1.5),borderRadius:12,padding:"12px 14px",fontFamily:BODY,marginBottom:18,lineHeight:1.45}}>{scanNote}</div>
          )}

          {scanRows.map(r=>{
            const rl=getLang(r.language), noText=!r.foreign_text.trim(), noMeaning=!r.native_text.trim();
            return (
              <div key={r.key} style={{border:outline(),borderRadius:16,background:r.keep?T.surface:"transparent",boxShadow:r.keep?drop(3,3):"none",padding:"10px 12px",marginBottom:9,opacity:r.keep?1:.55,transition:"all .15s"}}>
                <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:r.keep?8:0}}>
                  <input type="checkbox" checked={r.keep} onChange={e=>patchScanRow(r.key,{keep:e.target.checked})}
                    aria-label={`Keep ${r.foreign_text||r.native_text}`} style={{width:17,height:17,accentColor:INK,cursor:"pointer",flexShrink:0}}/>
                  {r.keep?(
                    <input value={r.foreign_text} onChange={e=>patchScanRow(r.key,{foreign_text:e.target.value})}
                      dir={rl.rtl?"rtl":"ltr"} placeholder="The phrase — needed to save" aria-label="Phrase"
                      style={{...iSt,flex:1,minWidth:0,width:"auto",fontFamily:rl.font,fontSize:rl.rtl?20:14,textAlign:rl.rtl?"right":"left",padding:"8px 12px",borderColor:noText?"#e2a13c":undefined}}/>
                  ):(
                    <div dir={rl.rtl?"rtl":"ltr"} style={{flex:1,minWidth:0,fontFamily:rl.font,fontSize:rl.rtl?20:15,fontWeight:700,color:INK,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",textAlign:rl.rtl?"right":"left"}}>{r.foreign_text||r.native_text||"—"}</div>
                  )}
                </div>
                {r.keep&&(
                  <div style={{display:"flex",flexDirection:"column",gap:8,paddingLeft:27}}>
                    <div style={{display:"flex",gap:6,alignItems:"center"}}>
                      <input value={r.native_text} onChange={e=>patchScanRow(r.key,{native_text:e.target.value,translated:false})}
                        placeholder="Translation" aria-label="Translation" style={{...iSt,flex:1,minWidth:0,width:"auto",padding:"8px 10px",fontSize:13,borderColor:noMeaning?"#e2a13c":undefined}}/>
                      {r.translated&&<span title="Translation written by the scanner, not read off the page" style={{fontSize:11,flexShrink:0}}>✨</span>}
                      <button type="button" onClick={()=>patchScanRow(r.key,{native_text:r.notes||"",notes:r.native_text,translated:false})} title="Swap the translation and the transliteration" aria-label="Swap translation and transliteration"
                        style={{flexShrink:0,background:T.surface,border:`1px solid ${T.borderMid}`,borderRadius:10,padding:"0 9px",alignSelf:"stretch",fontSize:14,color:T.inkMid,cursor:"pointer"}}>⇄</button>
                      <input value={r.notes||""} onChange={e=>patchScanRow(r.key,{notes:e.target.value})}
                        placeholder="Transliteration" aria-label="Transliteration" style={{...iSt,flex:1,minWidth:0,width:"auto",padding:"8px 10px",fontSize:13}}/>
                    </div>
                    <div style={{display:"flex",gap:6}}>
                      <select value={r.language} onChange={e=>patchScanRow(r.key,{language:e.target.value})} aria-label="Language" style={{...iSt,padding:"8px 10px",fontSize:12,flex:1}}>
                        {LANGUAGES.map(l=><option key={l.name} value={l.name}>{l.flag} {l.name}</option>)}
                      </select>
                      <select value={r.topic} onChange={e=>{ const v=e.target.value; if(v==="__new__") setCatDraft({mode:"scan",key:r.key,value:""}); else patchScanRow(r.key,{topic:v}); }} aria-label="Category" style={{...iSt,padding:"8px 10px",fontSize:12,flex:1}}>
                        {topicOptions}
                      </select>
                    </div>
                    {catDraftRow("scan",r.key)}
                  </div>
                )}
              </div>
            );
          })}

          {(scanLines.length>0||linesBusy)&&(
            <div style={{marginTop:scanRows.length?22:0,border:outline(),borderRadius:16,background:T.surface,boxShadow:drop(3,3),padding:"14px 16px"}}>
              <div style={{display:"flex",alignItems:"baseline",justifyContent:"space-between",gap:10,marginBottom:6}}>
                <div style={{fontSize:9,letterSpacing:2.5,color:T.muted,fontFamily:HEAD,fontWeight:700,textTransform:"uppercase"}}>What it read</div>
                {scanLines.length>0&&<div style={{fontSize:10,color:T.muted,fontFamily:BODY}}>{scanLines.length} line{scanLines.length>1?"s":""}</div>}
              </div>
              {linesBusy&&!scanLines.length&&(
                <div className="blink" style={{fontSize:12,color:T.muted,fontFamily:BODY,padding:"8px 0"}}>Reading text…</div>
              )}
              {scanLines.map((line,i)=>{
                const used=lineUsed(line), ar=isArabicScript(line);
                return (
                  <div key={i} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 0",borderTop:i?`1px solid ${T.border}`:"none",opacity:used?.45:1}}>
                    <div dir="auto" style={{flex:1,minWidth:0,fontFamily:ar?"'Scheherazade New',serif":BODY,fontSize:ar?20:14,color:INK,lineHeight:1.35,overflowWrap:"anywhere"}}>{line}</div>
                    {used?<span style={{fontSize:11,color:T.muted,fontFamily:BODY}}>added ✓</span>:<>
                      {meaningTarget&&(
                        <button onClick={()=>useLineAsMeaning(line)} title={`Use as the translation of ${meaningTarget.foreign_text}`}
                          style={{flexShrink:0,background:"transparent",border:`1px solid ${T.borderMid}`,borderRadius:9,padding:"5px 9px",fontSize:11,fontFamily:BODY,color:T.inkMid,cursor:"pointer"}}>as translation</button>
                      )}
                      <button onClick={()=>addLineAsPhrase(line)}
                        style={{flexShrink:0,background:INK,border:outline(1.5),borderRadius:9,padding:"5px 10px",fontSize:11,fontFamily:BODY,fontWeight:600,color:"#fff",cursor:"pointer"}}>+ phrase</button>
                    </>}
                  </div>
                );
              })}
            </div>
          )}

          <div style={{display:"flex",gap:10,marginTop:20,flexWrap:"wrap"}}>
            {scanRows.length>0&&(
              <button onClick={saveScan} disabled={scanBusy||!keptRows.length}
                style={{flex:1,minWidth:180,background:INK,border:outline(),borderRadius:14,color:"#fff",fontFamily:HEAD,fontWeight:800,fontSize:14,padding:"14px",cursor:"pointer",boxShadow:drop(4,4),opacity:scanBusy||!keptRows.length?.5:1}}>
                {scanBusy?"Adding…":`Add ${keptRows.length} phrase${keptRows.length===1?"":"s"}`}
              </button>
            )}
            <button onClick={()=>camRef.current?.click()} disabled={scanBusy}
              style={{background:T.surface,border:outline(),borderRadius:14,color:INK,fontFamily:HEAD,fontWeight:700,fontSize:14,padding:"14px 18px",cursor:"pointer",boxShadow:drop(3,3)}}>
              📸 Scan another
            </button>
            <button onClick={cancelScan} disabled={scanBusy}
              style={{background:"transparent",border:`1px solid ${T.borderMid}`,borderRadius:14,color:T.muted,fontFamily:BODY,fontSize:14,padding:"14px 18px",cursor:"pointer"}}>
              Cancel
            </button>
          </div>
        </div>
      )}

      {/* ══ FORM ══ */}
      {view==="form"&&(
        <div style={{padding:isDesktop?"36px 40px 60px":"20px 22px 40px",animation:"up .3s ease",maxWidth:isDesktop?620:500,marginLeft:isDesktop?"auto":0,marginRight:isDesktop?"auto":0,position:"relative",zIndex:1}}>
          <div style={{fontSize:9,letterSpacing:4,color:T.lav,fontFamily:HEAD,textTransform:"uppercase",marginBottom:5}}>{editPhrase?"Edit":"New Phrase"}</div>
          <div style={{fontSize:22,fontWeight:800,fontFamily:HEAD,marginBottom:22,color:T.ink,letterSpacing:"-.8px"}}>{editPhrase?"Update your phrase":"What did you learn today?"}</div>

          {!editPhrase&&(
            <div style={{marginBottom:22}}>
              {/* Three ways in: a photo can also be dropped on this row */}
              <div onDragOver={e=>e.preventDefault()} onDrop={e=>{e.preventDefault();startScan(e.dataTransfer.files[0]);}}
                   style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10}}>
                {[
                  {key:"snap",   icon:"📸", label:"Snap",   onClick:()=>camRef.current?.click(),  primary:true},
                  {key:"upload", icon:"🖼", label:"Upload", onClick:()=>fileRef.current?.click()},
                  {key:"paste",  icon:"📋", label:"Paste",  onClick:openBulk},
                ].map(b=>(
                  <button key={b.key} type="button" onClick={b.onClick}
                    style={{background:b.primary?INK:T.surface,border:outline(),borderRadius:14,color:b.primary?"#fff":INK,fontFamily:HEAD,fontWeight:700,fontSize:13,padding:"14px 8px",cursor:"pointer",boxShadow:drop(3,3),display:"flex",flexDirection:"column",alignItems:"center",gap:6}}>
                    <span style={{fontSize:22,lineHeight:1}}>{b.icon}</span>
                    <span>{b.label}</span>
                  </button>
                ))}
              </div>
              <div style={{display:"flex",alignItems:"center",gap:8,margin:"16px 0 4px"}}><div style={{flex:1,height:1,background:T.border}}/><span style={{fontSize:10,color:T.muted,fontFamily:BODY,whiteSpace:"nowrap"}}>or type one out</span><div style={{flex:1,height:1,background:T.border}}/></div>
            </div>
          )}

          <div style={{marginBottom:14}}>
            <label style={lSt}>Language</label>
            <div style={{display:"flex",gap:7}}>
              {LANGUAGES.map(l=>{const a=form.language===l.name;return <span key={l.name} className="ph" onClick={()=>setForm(p=>({...p,language:l.name}))} style={{padding:"7px 15px",borderRadius:20,fontSize:12,fontFamily:BODY,background:a?T.dark:T.surface,color:a?"#fff":T.inkMid,fontWeight:a?600:400,border:`1.5px solid ${a?T.dark:T.borderMid}`,boxShadow:a?"0 4px 12px rgba(26,24,37,.25)":"0 1px 3px rgba(0,0,0,.05)",cursor:"pointer"}}>{l.flag} {l.name}</span>;})}
            </div>
            {formLang.rtl&&<div style={{marginTop:7,fontSize:10,color:T.lav,fontFamily:BODY}}>↩ Right-to-left script</div>}
          </div>

          <div style={{marginBottom:13}}>
            <label style={lSt}>Phrase in {form.language}</label>
            <input value={form.foreign_text} onChange={e=>setForm(p=>({...p,foreign_text:e.target.value}))} placeholder={formLang.rtl?"اكتب العبارة هنا...":"Type the phrase…"} dir={formLang.rtl?"rtl":"ltr"} style={{...iSt,fontFamily:formLang.font,fontSize:formLang.rtl?22:15,lineHeight:1.5,textAlign:formLang.rtl?"right":"left"}}/>
          </div>

          <div style={{marginBottom:13}}>
            <label style={lSt}>Translation</label>
            <input value={form.native_text} onChange={e=>setForm(p=>({...p,native_text:e.target.value}))} placeholder="e.g. Good morning" style={iSt}/>
          </div>

          <div style={{marginBottom:13}}>
            <label style={lSt}>Transliteration</label>
            <input value={form.notes} onChange={e=>setForm(p=>({...p,notes:e.target.value}))} placeholder="e.g. sabah al-khayr" style={iSt}/>
          </div>

          <div style={{marginBottom:22}}>
            <label style={lSt}>Category</label>
            <select value={form.topic} onChange={e=>{ const v=e.target.value; if(v==="__new__") setCatDraft({mode:"form",key:"form",value:""}); else setForm(p=>({...p,topic:v})); }} style={iSt}>
              {topicOptions}
            </select>
            {catDraft?.mode==="form"&&<div style={{marginTop:8}}>{catDraftRow("form","form")}</div>}
          </div>

          <div style={{display:"flex",gap:10}}>
            <button onClick={saveForm} style={{flex:1,background:T.dark,border:"none",borderRadius:14,color:"#fff",fontFamily:HEAD,fontWeight:700,fontSize:14,padding:"14px",cursor:"pointer",boxShadow:"0 6px 20px rgba(26,24,37,.25)"}}>{editPhrase?"Save Changes":"Add Phrase"}</button>
            <button onClick={()=>setView("library")} style={{background:T.surface,border:`1px solid ${T.borderMid}`,borderRadius:14,color:T.muted,fontFamily:BODY,fontSize:14,padding:"14px 18px",cursor:"pointer"}}>Cancel</button>
          </div>
        </div>
      )}

      {/* ══ PASTE MANY ══ */}
      {view==="bulk"&&(
        <div style={{padding:isDesktop?`36px 40px ${bulkShowPaste?60:140}px`:`20px 22px ${bulkShowPaste?40:130}px`,animation:"up .3s ease",maxWidth:isDesktop?720:560,marginLeft:isDesktop?"auto":0,marginRight:isDesktop?"auto":0,position:"relative",zIndex:1}}>
          <div style={{fontSize:9,letterSpacing:4,color:T.lav,fontFamily:HEAD,textTransform:"uppercase",marginBottom:5}}>{bulkShowPaste?"Paste many":"Standby & review"}</div>
          <div style={{fontSize:isDesktop?26:22,fontWeight:800,fontFamily:HEAD,marginBottom:18,color:INK,letterSpacing:"-.8px"}}>
            {bulkShowPaste?"Paste your list":`${bulkRows.length} phrase${bulkRows.length>1?"s":""} to review`}
          </div>

          {bulkShowPaste?(<>
            <div style={{fontSize:12,color:T.muted,fontFamily:SERIF,fontStyle:"italic",lineHeight:1.55,marginBottom:12}}>
              One line is one phrase: the transliteration, the English, then the Arabic ("marhaban - Hello - مرحبا"), split by " - ", " / ", "--", a tab, "|" or brackets. Arabic first works too. A line like "Food:" or "# Travel" sets the category for the phrases below it. Nothing is saved until you've reviewed it.
            </div>
            <textarea value={bulkText} onChange={e=>setBulkText(e.target.value)} dir="auto" rows={isDesktop?12:9} autoFocus
              placeholder={"marhaban - Hello - مرحبا\nsabah al-khayr - Good morning - صباح الخير\nshukran jazilan | Thank you so much | شكرا جزيلا"}
              style={{...iSt,resize:"vertical",fontFamily:"'Scheherazade New','DM Sans',serif",fontSize:18,lineHeight:1.6}}/>
            {bulkNote&&<div style={{fontSize:13,color:INK,background:"#fff4d6",border:outline(1.5),borderRadius:12,padding:"12px 14px",fontFamily:BODY,marginTop:12}}>{bulkNote}</div>}
            <div style={{display:"flex",gap:10,marginTop:16,flexWrap:"wrap"}}>
              <button onClick={splitBulk} disabled={!bulkText.trim()}
                style={{flex:1,minWidth:180,background:INK,border:outline(),borderRadius:14,color:"#fff",fontFamily:HEAD,fontWeight:800,fontSize:14,padding:"14px",cursor:"pointer",boxShadow:drop(4,4),opacity:bulkText.trim()?1:.5}}>Split into phrases</button>
              <button onClick={()=>bulkRows.length?setBulkAdding(false):setView("form")}
                style={{background:"transparent",border:`1px solid ${T.borderMid}`,borderRadius:14,color:T.muted,fontFamily:BODY,fontSize:14,padding:"14px 18px",cursor:"pointer"}}>{bulkRows.length?`Back to the ${bulkRows.length} on standby`:"Back"}</button>
            </div>
          </>):(<>
            <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap",marginBottom:16}}>
              <div style={{flex:1,minWidth:150,fontSize:12,color:T.muted,fontFamily:SERIF,fontStyle:"italic",lineHeight:1.5}}>
                Tick the ones you approve and press Add. The rest stay on standby, kept on this device, until you add or ignore them. Fix any wrong split. If the translation and transliteration came out the wrong way round, use ⇄. Each phrase has its own category.
                {bulkIncomplete>0&&<><br/><span style={{color:"#b45309",fontStyle:"normal",fontFamily:BODY,fontWeight:600}}>{bulkIncomplete} still need{bulkIncomplete===1?"s":""} a phrase or translation.</span></>}
              </div>
              <button type="button" onClick={()=>setBulkRows(rows=>rows.map(r=>({...r,native_text:r.notes,notes:r.native_text})))} title="Swap translation and transliteration on every phrase"
                style={{...iSt,width:"auto",padding:"8px 10px",fontSize:12,flexShrink:0,cursor:"pointer"}}>⇄ Swap all</button>
              <select value="" onChange={e=>{ const v=e.target.value; if(v==="__new__") setCatDraft({mode:"bulkAll",key:"all",value:""}); else if(v) setBulkRows(rows=>rows.map(r=>({...r,topic:v}))); }} aria-label="Set the category of every phrase"
                style={{...iSt,width:"auto",padding:"8px 10px",fontSize:12,flexShrink:0}}>
                <option value="">Set all categories…</option>
                {topicOptions}
              </select>
            </div>

            {catDraft?.mode==="bulkAll"&&<div style={{marginBottom:14}}>{catDraftRow("bulkAll","all")}</div>}
            {bulkNote&&<div style={{fontSize:12,color:INK,background:T.lavLight,border:outline(1.5),borderRadius:12,padding:"10px 13px",fontFamily:BODY,marginBottom:14,lineHeight:1.5}}>{bulkNote}</div>}

            <div style={{border:outline(),borderRadius:16,background:T.surface,boxShadow:drop(3,3),padding:"12px 14px",marginBottom:16}}>
              <div style={{fontSize:9,letterSpacing:2.5,color:T.muted,fontFamily:HEAD,fontWeight:700,textTransform:"uppercase",marginBottom:9}}>Categories in this list</div>
              <div style={{display:"flex",flexWrap:"wrap",gap:8,alignItems:"center"}}>
                {bulkTopicsInUse.map(t=>{
                  const info=getTopic(t), n=bulkRows.filter(r=>r.topic===t).length;
                  if(catDraft?.mode==="rename"&&catDraft.from===t) return (
                    <input key={t} autoFocus value={catDraft.value} onChange={e=>setCatDraft({...catDraft,value:e.target.value})} onBlur={commitCat}
                      onKeyDown={e=>{ if(e.key==="Enter") commitCat(); else if(e.key==="Escape") setCatDraft(null); }} aria-label={`Rename ${info.label}`}
                      style={{...iSt,width:150,padding:"6px 10px",fontSize:12,borderRadius:20}}/>
                  );
                  return (
                    <span key={t} style={{display:"inline-flex",alignItems:"center",gap:6,padding:"5px 6px 5px 11px",borderRadius:20,background:T.surfaceHi,border:`1px solid ${T.borderMid}`,fontSize:12,fontFamily:BODY,color:INK}}>
                      <span>{info.icon} {info.label}</span>
                      <span style={{color:T.muted,fontSize:10}}>{n}</span>
                      {t!=="Other"&&<>
                        <button type="button" onClick={()=>setCatDraft({mode:"rename",from:t,value:info.label})} title="Rename — its phrases move to the new name" aria-label={`Rename ${info.label}`}
                          style={{background:"none",border:"none",cursor:"pointer",fontSize:12,padding:"0 3px",color:T.inkMid}}>✎</button>
                        <button type="button" onClick={()=>removeCat(t)} title="Remove — its phrases move to Other" aria-label={`Remove ${info.label}`}
                          style={{background:"none",border:"none",cursor:"pointer",fontSize:12,padding:"0 4px 0 0",color:T.muted}}>✕</button>
                      </>}
                    </span>
                  );
                })}
                {catDraft?.mode==="add"?(
                  <input autoFocus value={catDraft.value} onChange={e=>setCatDraft({...catDraft,value:e.target.value})} onBlur={commitCat} placeholder="New category name"
                    onKeyDown={e=>{ if(e.key==="Enter") commitCat(); else if(e.key==="Escape") setCatDraft(null); }} aria-label="New category name"
                    style={{...iSt,width:170,padding:"6px 10px",fontSize:12,borderRadius:20}}/>
                ):(
                  <button type="button" onClick={()=>setCatDraft({mode:"add",value:""})}
                    style={{padding:"6px 12px",borderRadius:20,background:"transparent",border:`1px dashed ${T.borderMid}`,fontSize:12,fontFamily:BODY,color:T.inkMid,cursor:"pointer"}}>＋ Add category</button>
                )}
              </div>
            </div>

            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
              <span style={{flex:1,fontSize:12,color:T.muted,fontFamily:BODY}}>{bulkRows.filter(r=>r.keep).length} of {bulkRows.length} selected</span>
              <button type="button" onClick={()=>setBulkRows(rows=>rows.map(r=>({...r,keep:true})))} disabled={bulkRows.every(r=>r.keep)}
                style={{background:T.surface,border:`1px solid ${T.borderMid}`,borderRadius:10,padding:"6px 12px",fontSize:12,fontFamily:BODY,fontWeight:600,color:INK,cursor:"pointer",opacity:bulkRows.every(r=>r.keep)?.45:1}}>Select all</button>
              <button type="button" onClick={()=>setBulkRows(rows=>rows.map(r=>({...r,keep:false})))} disabled={!bulkRows.some(r=>r.keep)}
                style={{background:T.surface,border:`1px solid ${T.borderMid}`,borderRadius:10,padding:"6px 12px",fontSize:12,fontFamily:BODY,fontWeight:600,color:INK,cursor:"pointer",opacity:bulkRows.some(r=>r.keep)?1:.45}}>Deselect all</button>
              <button type="button" onClick={()=>setIgnoreAsk("unticked")} disabled={!bulkRows.some(r=>!r.keep)}
                style={{background:T.surface,border:`1px solid ${T.borderMid}`,borderRadius:10,padding:"6px 12px",fontSize:12,fontFamily:BODY,fontWeight:600,color:"#b45309",cursor:"pointer",opacity:bulkRows.some(r=>!r.keep)?1:.45}}>Ignore unticked</button>
            </div>

            {bulkRows.map(r=>{
              const rl=getLang(r.language), noText=!r.foreign_text.trim(), noMeaning=!r.native_text.trim();
              return (
                <div key={r.key} style={{border:outline(),borderRadius:16,background:r.keep?T.surface:"transparent",boxShadow:r.keep?drop(3,3):"none",padding:"10px 12px",marginBottom:9,opacity:r.keep?1:.55,transition:"all .15s"}}>
                  <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:r.keep?8:0}}>
                    <input type="checkbox" checked={r.keep} onChange={e=>patchBulkRow(r.key,{keep:e.target.checked})}
                      aria-label={`Keep ${r.foreign_text||r.native_text}`} style={{width:17,height:17,accentColor:INK,cursor:"pointer",flexShrink:0}}/>
                    {r.keep?(
                      <input value={r.foreign_text} onChange={e=>patchBulkRow(r.key,{foreign_text:e.target.value})}
                        dir={rl.rtl?"rtl":"ltr"} placeholder="The phrase — needed to save" aria-label="Phrase"
                        style={{...iSt,flex:1,minWidth:0,width:"auto",fontFamily:rl.font,fontSize:rl.rtl?20:14,textAlign:rl.rtl?"right":"left",padding:"8px 12px",borderColor:noText?"#e2a13c":undefined}}/>
                    ):(
                      <div dir={rl.rtl?"rtl":"ltr"} style={{flex:1,minWidth:0,fontFamily:rl.font,fontSize:rl.rtl?20:15,fontWeight:700,color:INK,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",textAlign:rl.rtl?"right":"left"}}>{r.foreign_text||r.native_text||"—"}</div>
                    )}
                    <button type="button" onClick={()=>setBulkRows(rows=>rows.filter(x=>x.key!==r.key))} aria-label="Ignore this phrase" title="Ignore: remove it from standby"
                      style={{background:"none",border:"none",color:T.muted,cursor:"pointer",fontSize:14,padding:"0 2px",flexShrink:0,lineHeight:1}}>✕</button>
                  </div>
                  {r.keep&&(
                    <div style={{display:"flex",flexDirection:"column",gap:8,paddingLeft:27}}>
                      <div style={{display:"flex",gap:6}}>
                        <input value={r.native_text} onChange={e=>patchBulkRow(r.key,{native_text:e.target.value})}
                          placeholder="Translation" aria-label="Translation" style={{...iSt,flex:1,minWidth:0,width:"auto",padding:"8px 10px",fontSize:13,borderColor:noMeaning?"#e2a13c":undefined}}/>
                        <button type="button" onClick={()=>patchBulkRow(r.key,{native_text:r.notes,notes:r.native_text})} title="Swap the translation and the transliteration" aria-label="Swap translation and transliteration"
                          style={{flexShrink:0,background:T.surface,border:`1px solid ${T.borderMid}`,borderRadius:10,padding:"0 9px",fontSize:14,color:T.inkMid,cursor:"pointer"}}>⇄</button>
                        <input value={r.notes} onChange={e=>patchBulkRow(r.key,{notes:e.target.value})}
                          placeholder="Transliteration" aria-label="Transliteration or notes" style={{...iSt,flex:1,minWidth:0,width:"auto",padding:"8px 10px",fontSize:13}}/>
                      </div>
                      <div style={{display:"flex",gap:8}}>
                        <select value={r.language} onChange={e=>patchBulkRow(r.key,{language:e.target.value})} aria-label="Language" style={{...iSt,padding:"8px 10px",fontSize:12,flex:1}}>
                          {LANGUAGES.map(l=><option key={l.name} value={l.name}>{l.flag} {l.name}</option>)}
                        </select>
                        <select value={r.topic} onChange={e=>{ const v=e.target.value; if(v==="__new__") setCatDraft({mode:"row",key:r.key,value:""}); else patchBulkRow(r.key,{topic:v}); }} aria-label="Category" style={{...iSt,padding:"8px 10px",fontSize:12,flex:1}}>
                          {topicList.filter(t=>t.id!=="All").map(t=><option key={t.id} value={t.id}>{t.icon} {t.label}</option>)}
                          <option value="__new__">＋ New category…</option>
                        </select>
                      </div>
                      {catDraft?.mode==="row"&&catDraft.key===r.key&&(
                        <div style={{display:"flex",gap:8}}>
                          <input autoFocus value={catDraft.value} onChange={e=>setCatDraft({...catDraft,value:e.target.value})} placeholder="New category name" aria-label="New category name"
                            onKeyDown={e=>{ if(e.key==="Enter") commitCat(); else if(e.key==="Escape") setCatDraft(null); }} style={{...iSt,padding:"8px 12px",fontSize:12,flex:1}}/>
                          <button type="button" onClick={commitCat} style={{flexShrink:0,background:INK,border:outline(1.5),borderRadius:12,color:"#fff",fontFamily:BODY,fontWeight:600,fontSize:12,padding:"0 14px",cursor:"pointer"}}>Add</button>
                          <button type="button" onClick={()=>setCatDraft(null)} style={{flexShrink:0,background:"transparent",border:`1px solid ${T.borderMid}`,borderRadius:12,color:T.muted,fontFamily:BODY,fontSize:12,padding:"0 12px",cursor:"pointer"}}>Cancel</button>
                        </div>
                      )}
                    </div>
                  )}
                </div>
              );
            })}

          </>)}
        </div>
      )}

      {/* Paste many — actions stay in view while you scroll the list */}
      {view==="bulk"&&!bulkShowPaste&&(
        <div className="cta-bar" style={{position:"fixed",bottom:0,left:0,right:0,zIndex:50,padding:isDesktop?"22px 40px 26px":"20px 22px 24px"}}>
          <div style={{maxWidth:isDesktop?640:516,margin:isDesktop?"0 auto":0,display:"flex",gap:10}}>
            <button onClick={saveBulk} disabled={bulkBusy||!bulkKept.length}
              style={{flex:1,background:INK,border:outline(),borderRadius:14,color:"#fff",fontFamily:HEAD,fontWeight:800,fontSize:14,padding:"14px",cursor:"pointer",boxShadow:drop(4,4),opacity:bulkBusy||!bulkKept.length?.5:1}}>
              {bulkBusy?"Adding…":`Add ${bulkKept.length} phrase${bulkKept.length===1?"":"s"}`}
            </button>
            <button onClick={()=>{ setBulkAdding(true); setBulkText(""); setCatDraft(null); }} disabled={bulkBusy}
              style={{background:T.surface,border:outline(),borderRadius:14,color:INK,fontFamily:HEAD,fontWeight:700,fontSize:14,padding:"14px 16px",cursor:"pointer",boxShadow:drop(3,3)}}>＋ Paste more</button>
            <button onClick={()=>setView("library")} disabled={bulkBusy} title="Leave the rest on standby and finish later"
              style={{background:T.surface,border:`1px solid ${T.borderMid}`,borderRadius:14,color:T.muted,fontFamily:BODY,fontSize:14,padding:"14px 16px",cursor:"pointer"}}>Later</button>
          </div>
        </div>
      )}

      {/* ══ SETTINGS · CATEGORIES ══ */}
      {view==="settings"&&settingsTab==="categories"&&(
        <div style={{padding:isDesktop?"36px 40px 100px":"20px 22px 100px",animation:"up .3s ease",maxWidth:isDesktop?720:560,marginLeft:isDesktop?"auto":0,marginRight:isDesktop?"auto":0,position:"relative",zIndex:1}}>
          {settingsHeader}
          <div style={{fontSize:isDesktop?22:19,fontWeight:800,fontFamily:HEAD,marginBottom:8,color:INK,letterSpacing:"-.6px"}}>Categories</div>
          <div style={{fontSize:12,color:T.muted,fontFamily:SERIF,fontStyle:"italic",lineHeight:1.55,marginBottom:14}}>Pick the emoji for each category. Card colours follow it. Your own categories can be renamed or deleted; the built-in ones keep their names.</div>
          {!catsReady&&<div style={{fontSize:12,color:INK,background:"#fff4d6",border:outline(1.5),borderRadius:12,padding:"10px 13px",fontFamily:BODY,marginBottom:14,lineHeight:1.5}}>Choosing an emoji, and keeping a category that has no phrases yet, needs a one-time update to the database (a small categories table). Renaming and deleting your own categories works without it.</div>}

          <div style={{border:outline(),borderRadius:16,background:T.surface,boxShadow:drop(3,3),padding:"12px 14px",marginBottom:16}}>
            <div style={{fontSize:9,letterSpacing:2.5,color:T.muted,fontFamily:HEAD,fontWeight:700,textTransform:"uppercase",marginBottom:9}}>Add a category</div>
            <div style={{display:"flex",gap:8}}>
              <button type="button" onClick={()=>setEmojiFor(f=>f==="__new__"?null:"__new__")} aria-label="Choose an emoji"
                style={{width:42,height:42,flexShrink:0,fontSize:22,lineHeight:1,background:T.surfaceHi,border:`1px solid ${T.borderMid}`,borderRadius:12,cursor:"pointer"}}>{newCat.emoji||getTopic(canonTopic(newCat.name)||"__none__").icon}</button>
              <input value={newCat.name} onChange={e=>setNewCat(c=>({...c,name:e.target.value}))} onKeyDown={e=>{ if(e.key==="Enter") addCat(); }} placeholder="New category name" aria-label="New category name" style={{...iSt,flex:1,padding:"9px 12px"}}/>
              <button type="button" onClick={addCat} disabled={catBusy} style={{flexShrink:0,background:INK,border:outline(1.5),borderRadius:12,color:"#fff",fontFamily:HEAD,fontWeight:800,fontSize:13,padding:"0 16px",cursor:"pointer"}}>Add</button>
            </div>
            {emojiFor==="__new__"&&emojiPicker(e=>{ setNewCat(c=>({...c,emoji:e})); setEmojiFor(null); })}
          </div>

          {topicList.filter(t=>t.id!=="All").map(t=>{
            const custom=!TOPICS.some(b=>b.id===t.id), n=phrases.filter(x=>x.topic===t.id).length;
            return (
              <div key={t.id} style={{border:outline(1.5),borderRadius:14,background:T.surface,padding:"8px 10px",marginBottom:8}}>
                <div style={{display:"flex",alignItems:"center",gap:10}}>
                  <button type="button" onClick={()=>setEmojiFor(f=>f===t.id?null:t.id)} aria-label={`Change the emoji for ${t.label}`} title="Change emoji"
                    style={{width:42,height:42,flexShrink:0,fontSize:22,lineHeight:1,background:getTopicStyle(t.id).bg,border:outline(1.5),borderRadius:12,cursor:"pointer"}}>{t.icon}</button>
                  {custom?(
                    <input value={catNameDraft[t.id]??t.label} onChange={e=>setCatNameDraft(d=>({...d,[t.id]:e.target.value}))}
                      onBlur={()=>{ const v=catNameDraft[t.id]; if(v!==undefined&&v.trim()&&v.trim()!==t.label) renameCat(t.id,v); else setCatNameDraft(d=>{ const x={...d}; delete x[t.id]; return x; }); }}
                      onKeyDown={e=>{ if(e.key==="Enter") e.target.blur(); else if(e.key==="Escape"){ setCatNameDraft(d=>{ const x={...d}; delete x[t.id]; return x; }); e.target.blur(); } }}
                      aria-label={`Name of ${t.label}`} disabled={catBusy} style={{...iSt,flex:1,minWidth:0,padding:"8px 12px",fontSize:14,fontWeight:600}}/>
                  ):(
                    <div style={{flex:1,minWidth:0,fontSize:14,fontWeight:600,fontFamily:BODY,color:INK}}>{t.label} <span style={{fontSize:10,color:T.muted,fontWeight:500}}>built in</span></div>
                  )}
                  <span style={{fontSize:11,color:T.muted,fontFamily:BODY,flexShrink:0}}>{n} phrase{n===1?"":"s"}</span>
                  {custom&&<button type="button" onClick={()=>setCatDel(t.id)} aria-label={`Delete ${t.label}`} title="Delete category"
                    style={{background:"none",border:"none",color:INK,cursor:"pointer",padding:6,borderRadius:8,display:"flex",flexShrink:0}}><IconTrash size={16}/></button>}
                </div>
                {emojiFor===t.id&&emojiPicker(e=>pickEmoji(t.id,e))}
              </div>
            );
          })}
        </div>
      )}
      {catDel&&view==="settings"&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.35)",zIndex:100,display:"flex",alignItems:"center",justifyContent:"center",padding:24}} onClick={()=>!catBusy&&setCatDel(null)}>
          <div onClick={e=>e.stopPropagation()} style={{background:T.surface,border:`1px solid ${T.borderMid}`,borderRadius:20,padding:24,maxWidth:300,width:"100%",animation:"pop .2s ease",boxShadow:"0 20px 60px rgba(0,0,0,.15)"}}>
            <div style={{fontSize:17,fontWeight:800,fontFamily:HEAD,marginBottom:6,color:T.ink}}>Delete {catDel}?</div>
            <div style={{fontSize:12,color:T.muted,fontFamily:BODY,marginBottom:20}}>{phrases.filter(x=>x.topic===catDel).length} phrase{phrases.filter(x=>x.topic===catDel).length===1?"":"s"} in it will move to Other. The phrases themselves are kept.</div>
            <div style={{display:"flex",gap:9}}>
              <button onClick={()=>deleteCat(catDel)} disabled={catBusy} style={{flex:1,background:"#fee2e2",border:"1px solid #fca5a5",borderRadius:12,color:"#dc2626",padding:"11px",cursor:"pointer",fontFamily:HEAD,fontWeight:700,fontSize:13,opacity:catBusy?.6:1}}>{catBusy?"Deleting…":"Delete"}</button>
              <button onClick={()=>setCatDel(null)} disabled={catBusy} style={{flex:1,background:T.surfaceHi,border:`1px solid ${T.border}`,borderRadius:12,color:T.muted,padding:"11px",cursor:"pointer",fontFamily:BODY,fontSize:13}}>Cancel</button>
            </div>
          </div>
        </div>
      )}

      {/* ══ SETTINGS · PHRASES (edit many) ══ */}
      {inManage&&(
        <div style={{padding:isDesktop?"36px 40px 140px":"20px 22px 130px",animation:"up .3s ease",maxWidth:isDesktop?940:560,marginLeft:isDesktop?"auto":0,marginRight:isDesktop?"auto":0,position:"relative",zIndex:1}}>
          {settingsHeader}
          <div style={{fontSize:isDesktop?22:19,fontWeight:800,fontFamily:HEAD,marginBottom:8,color:INK,letterSpacing:"-.6px"}}>{manageRows.length} {activeLang} phrase{manageRows.length===1?"":"s"}</div>
          <div style={{fontSize:12,color:T.muted,fontFamily:SERIF,fontStyle:"italic",lineHeight:1.55,marginBottom:14}}>Change any field, or tick phrases to give them a category or delete them together. Edited rows turn yellow. Nothing is saved until you press Save.</div>

          <input value={manageQ} onChange={e=>setManageQ(e.target.value)} placeholder="Search phrases, transliterations, categories…" aria-label="Search phrases" style={{...iSt,marginBottom:12,padding:"10px 14px"}}/>

          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
            <span style={{flex:1,fontSize:12,color:T.muted,fontFamily:BODY}}>{manageSel.size} of {manageRows.length} selected{manageQ.trim()?` · ${manageShown.length} shown`:""}</span>
            <button type="button" onClick={()=>setManageSel(s=>new Set([...s,...manageShown.map(p=>p.id)]))} disabled={!manageShown.length}
              style={{background:T.surface,border:`1px solid ${T.borderMid}`,borderRadius:10,padding:"6px 12px",fontSize:12,fontFamily:BODY,fontWeight:600,color:INK,cursor:"pointer"}}>Select all</button>
            <button type="button" onClick={()=>setManageSel(new Set())} disabled={!manageSel.size}
              style={{background:T.surface,border:`1px solid ${T.borderMid}`,borderRadius:10,padding:"6px 12px",fontSize:12,fontFamily:BODY,fontWeight:600,color:INK,cursor:"pointer",opacity:manageSel.size?1:.45}}>Deselect all</button>
          </div>

          {manageSel.size>0&&(
            <div style={{border:outline(),borderRadius:14,background:T.lavLight,padding:"10px 12px",marginBottom:14,display:"flex",flexWrap:"wrap",gap:8,alignItems:"center"}}>
              <span style={{fontSize:12,fontWeight:700,fontFamily:HEAD,color:INK}}>{manageSel.size} selected</span>
              <select value="" aria-label="Set the category of the selected phrases"
                onChange={e=>{ const v=e.target.value; if(v==="__new__") setCatDraft({mode:"manage",value:""}); else if(v) applyToSelected({topic:v}); }}
                style={{...iSt,width:"auto",padding:"7px 10px",fontSize:12}}>
                <option value="">Set category…</option>
                {topicList.filter(t=>t.id!=="All").map(t=><option key={t.id} value={t.id}>{t.icon} {t.label}</option>)}
                <option value="__new__">＋ New category…</option>
              </select>
              <select value="" aria-label="Set the language of the selected phrases" onChange={e=>{ if(e.target.value) applyToSelected({language:e.target.value}); }}
                style={{...iSt,width:"auto",padding:"7px 10px",fontSize:12}}>
                <option value="">Set language…</option>
                {LANGUAGES.map(l=><option key={l.name} value={l.name}>{l.flag} {l.name}</option>)}
              </select>
              <button type="button" onClick={()=>setManageDel(true)}
                style={{marginLeft:"auto",background:"#fee2e2",border:"1px solid #fca5a5",borderRadius:10,color:"#dc2626",padding:"7px 12px",cursor:"pointer",fontFamily:HEAD,fontWeight:700,fontSize:12}}>🗑 Delete</button>
              {catDraft?.mode==="manage"&&(
                <div style={{display:"flex",gap:8,flexBasis:"100%"}}>
                  <input autoFocus value={catDraft.value} onChange={e=>setCatDraft({...catDraft,value:e.target.value})} placeholder="New category name" aria-label="New category name"
                    onKeyDown={e=>{ if(e.key==="Enter") commitCat(); else if(e.key==="Escape") setCatDraft(null); }} style={{...iSt,padding:"7px 12px",fontSize:12,flex:1}}/>
                  <button type="button" onClick={commitCat} style={{flexShrink:0,background:INK,border:outline(1.5),borderRadius:10,color:"#fff",fontFamily:BODY,fontWeight:600,fontSize:12,padding:"0 14px",cursor:"pointer"}}>Apply</button>
                  <button type="button" onClick={()=>setCatDraft(null)} style={{flexShrink:0,background:"transparent",border:`1px solid ${T.borderMid}`,borderRadius:10,color:T.muted,fontFamily:BODY,fontSize:12,padding:"0 12px",cursor:"pointer"}}>Cancel</button>
                </div>
              )}
            </div>
          )}

          {manageShown.map(p=>{
            const v=manageView(p), rl=getLang(v.language), sel=manageSel.has(p.id), dirty=Object.keys(manageChanged(p)).length>0;
            const noText=!String(v.foreign_text||"").trim(), noMeaning=!String(v.native_text||"").trim();
            const mi={...iSt,width:"auto",minWidth:0,flex:1,padding:"7px 10px",fontSize:13};
            const phraseIn=<input value={v.foreign_text||""} onChange={e=>patchManage(p.id,{foreign_text:e.target.value})} dir={rl.rtl?"rtl":"ltr"} aria-label="Phrase" placeholder="The phrase"
              style={{...mi,fontFamily:rl.font,fontSize:rl.rtl?18:14,textAlign:rl.rtl?"right":"left",borderColor:noText?"#e2a13c":undefined}}/>;
            const meaningIn=<input value={v.native_text||""} onChange={e=>patchManage(p.id,{native_text:e.target.value})} aria-label="Translation" placeholder="Translation" style={{...mi,borderColor:noMeaning?"#e2a13c":undefined}}/>;
            const notesIn=<input value={v.notes||""} onChange={e=>patchManage(p.id,{notes:e.target.value})} aria-label="Transliteration or notes" placeholder="Transliteration" style={mi}/>;
            const topicSel=<select value={v.topic} onChange={e=>{ const nv=e.target.value; if(nv==="__new__") setCatDraft({mode:"mrow",key:p.id,value:""}); else patchManage(p.id,{topic:nv}); }} aria-label="Category" style={{...mi,flex:isDesktop?"none":1,width:isDesktop?150:"auto",fontSize:12}}>
              {topicOptions}</select>;
            const langSel=<select value={v.language} onChange={e=>patchManage(p.id,{language:e.target.value})} aria-label="Language" style={{...mi,fontSize:12}}>
              {LANGUAGES.map(l=><option key={l.name} value={l.name}>{l.flag} {l.name}</option>)}</select>;
            return (
              <div key={p.id} style={{border:outline(1.5),borderRadius:14,background:sel?T.lavLight:dirty?"#fff8e6":T.surface,padding:"8px 10px",marginBottom:8}}>
               <div style={{display:"flex",alignItems:isDesktop?"center":"flex-start",gap:10}}>
                <input type="checkbox" checked={sel} onChange={e=>toggleManageSel(p.id,e.target.checked)} aria-label={`Select ${v.foreign_text||v.native_text}`} style={{width:17,height:17,accentColor:INK,cursor:"pointer",flexShrink:0,marginTop:isDesktop?0:9}}/>
                {isDesktop?(
                  <div style={{flex:1,minWidth:0,display:"grid",gridTemplateColumns:"1.1fr 1.1fr 1fr auto",gap:8,alignItems:"center"}}>{phraseIn}{meaningIn}{notesIn}{topicSel}</div>
                ):(
                  <div style={{flex:1,minWidth:0,display:"flex",flexDirection:"column",gap:6}}>
                    {phraseIn}
                    <div style={{display:"flex",gap:6}}>{meaningIn}{notesIn}</div>
                    <div style={{display:"flex",gap:6}}>{langSel}{topicSel}</div>
                  </div>
                )}
               </div>
               {catDraft?.mode==="mrow"&&catDraft.key===p.id&&<div style={{marginTop:8}}>{catDraftRow("mrow",p.id)}</div>}
              </div>
            );
          })}
          {!manageShown.length&&<div style={{textAlign:"center",padding:"40px 0",color:T.muted,fontFamily:BODY,fontSize:13}}>{manageRows.length?"No phrases match your search":"No phrases left here"}</div>}
        </div>
      )}
      {inManage&&(
        <div className="cta-bar" style={{position:"fixed",bottom:0,left:0,right:0,zIndex:50,padding:isDesktop?"22px 40px 26px":"20px 22px 24px"}}>
          <div style={{maxWidth:isDesktop?860:516,margin:isDesktop?"0 auto":0,display:"flex",gap:10}}>
            <button onClick={saveManage} disabled={manageBusy||!manageDirty.length}
              style={{flex:1,background:INK,border:outline(),borderRadius:14,color:"#fff",fontFamily:HEAD,fontWeight:800,fontSize:14,padding:"14px",cursor:"pointer",boxShadow:drop(4,4),opacity:manageBusy||!manageDirty.length?.5:1}}>
              {manageBusy?"Saving…":manageDirty.length?`Save ${manageDirty.length} change${manageDirty.length===1?"":"s"}`:"No changes yet"}
            </button>
            <button onClick={()=>setView("library")} disabled={manageBusy}
              style={{background:T.surface,border:outline(),borderRadius:14,color:INK,fontFamily:HEAD,fontWeight:700,fontSize:14,padding:"14px 18px",cursor:"pointer",boxShadow:drop(3,3)}}>{manageDirty.length?"Discard":"Done"}</button>
          </div>
        </div>
      )}
      {manageDel&&inManage&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.35)",zIndex:100,display:"flex",alignItems:"center",justifyContent:"center",padding:24}} onClick={()=>!manageBusy&&setManageDel(false)}>
          <div onClick={e=>e.stopPropagation()} style={{background:T.surface,border:`1px solid ${T.borderMid}`,borderRadius:20,padding:24,maxWidth:300,width:"100%",animation:"pop .2s ease",boxShadow:"0 20px 60px rgba(0,0,0,.15)"}}>
            <div style={{fontSize:17,fontWeight:800,fontFamily:HEAD,marginBottom:6,color:T.ink}}>Delete {manageSel.size} phrase{manageSel.size===1?"":"s"}?</div>
            <div style={{fontSize:12,color:T.muted,fontFamily:BODY,marginBottom:20}}>They're removed permanently and can't be brought back.</div>
            <div style={{display:"flex",gap:9}}>
              <button onClick={deleteManage} disabled={manageBusy} style={{flex:1,background:"#fee2e2",border:"1px solid #fca5a5",borderRadius:12,color:"#dc2626",padding:"11px",cursor:"pointer",fontFamily:HEAD,fontWeight:700,fontSize:13,opacity:manageBusy?.6:1}}>{manageBusy?"Deleting…":"Delete"}</button>
              <button onClick={()=>setManageDel(false)} disabled={manageBusy} style={{flex:1,background:T.surfaceHi,border:`1px solid ${T.border}`,borderRadius:12,color:T.muted,padding:"11px",cursor:"pointer",fontFamily:BODY,fontSize:13}}>Cancel</button>
            </div>
          </div>
        </div>
      )}

      {/* ══ BOTTOM BAR — desktop ══ */}
      {view==="library"&&isDesktop&&(
        <div className="cta-bar" style={{position:"fixed",bottom:0,left:0,right:0,zIndex:50,padding:"20px 40px 28px"}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:18}}>
            {[
              // Once today's review is done there is nothing due: Practice takes Review's place.
              {key:"practice", icon:"🃏", label:"Practice",   onClick:()=>startPractice("all"), bg:CTA_PINK, fg:INK},
              {key:"due",      icon:<IllustBolt size={21}/>, label:"Review",     onClick:()=>startPractice("due"), bg:CTA_PINK, fg:INK},
              {key:"add",      icon:"+",  label:"Add phrase", onClick:tryAdd,                   bg:CTA_NAVY, fg:"#fff", strong:true},
            ].filter(b=>b.key==="add"||(b.key==="due")===(dueCount>0)).map(b=>(         // Review while today's review isn't done, Practice once it is
            
              <button key={b.key} className="cth" onClick={b.onClick}
                style={{...CTA,background:b.bg,color:b.fg,fontFamily:HEAD,fontWeight:b.strong?800:700,fontSize:15,
                        padding:"15px 28px",display:"flex",alignItems:"center",gap:10,cursor:"pointer",whiteSpace:"nowrap"}}>
                <span style={{fontSize:b.icon==="+"?22:17,lineHeight:1,fontWeight:400}}>{b.icon}</span>
                <span>{b.label}</span>
                {b.badge>0&&<span style={{background:"rgba(255,255,255,.16)",borderRadius:20,padding:"2px 9px",fontSize:12,fontFamily:BODY,fontWeight:700}}>{b.badge}</span>}
              </button>
            ))}
          </div>
        </div>
      )}

      {/* ══ BOTTOM BAR — mobile ══ */}
      {view==="library"&&!isDesktop&&(
        <div className="cta-bar" style={{position:"fixed",bottom:0,left:0,right:0,zIndex:50,padding:"12px 22px 28px"}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:9}}>

            {/* Review — once today's review is done, Practice takes its place */}
            {dueCount>0?(
              <button className="cth" onClick={()=>startPractice("due")}
                style={{...CTA_S,flex:1,background:CTA_PINK,color:INK,fontFamily:HEAD,fontWeight:700,fontSize:13,padding:"14px 8px",display:"flex",alignItems:"center",justifyContent:"center",gap:5}}>
                <IllustBolt size={19}/>
                <span>Review</span>
              </button>
            ):(
              <button className="cth" onClick={()=>startPractice("all")}
                style={{...CTA_S,flex:1,background:CTA_PINK,color:INK,fontFamily:HEAD,fontWeight:700,fontSize:13,padding:"14px 8px",display:"flex",alignItems:"center",justifyContent:"center",gap:5}}>
                <span>🃏</span>
                <span>Practice</span>
              </button>
            )}

            {/* Add a phrase (Snap, Upload and Paste are on that screen) */}
            <button className="plus-fab" onClick={tryAdd} aria-label="Add a phrase"
              style={{...CTA_S,width:58,height:58,borderRadius:"50%",background:CTA_NAVY,color:"#fff",fontSize:30,lineHeight:1,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,fontWeight:400}}>
              +
            </button>

          </div>
        </div>
      )}

      {/* Admin login — opens when a visitor taps an add button */}
      {loginOpen&&readOnly&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.35)",zIndex:110,display:"flex",alignItems:"center",justifyContent:"center",padding:24}} onClick={()=>setLoginOpen(false)}>
          <form onSubmit={handleAuth} onClick={e=>e.stopPropagation()}
            style={{background:T.surface,border:outline(2.5),borderRadius:24,padding:"28px 26px",width:"100%",maxWidth:360,boxShadow:drop(6,6),display:"flex",flexDirection:"column",gap:14}}>
            <div>
              <div style={{fontSize:9,letterSpacing:4,color:T.lav,fontFamily:HEAD,textTransform:"uppercase",marginBottom:5}}>Admin</div>
              <div style={{fontSize:21,fontWeight:800,fontFamily:HEAD,color:INK,letterSpacing:"-.6px"}}>{loginFor==="settings"?"Log in to open settings":"Log in to add phrases"}</div>
              <div style={{fontSize:12,color:T.muted,fontFamily:BODY,marginTop:6,lineHeight:1.5}}>Only the owner can add or change phrases and categories. Everyone else can browse and practise.</div>
            </div>
            <div><label style={lSt}>Email</label><input type="email" value={authEmail} onChange={e=>setAuthEmail(e.target.value)} placeholder="you@example.com" required autoFocus style={iSt}/></div>
            <div><label style={lSt}>Password</label><input type="password" value={authPw} onChange={e=>setAuthPw(e.target.value)} placeholder="••••••••" required style={iSt}/></div>
            {authError&&<div style={{fontSize:12,color:"#dc2626",background:"#fee2e2",border:"1px solid #fca5a5",borderRadius:10,padding:"9px 12px"}}>{authError}</div>}
            {authSuccess&&<div style={{fontSize:12,color:"#16a34a",background:"#f0fdf4",border:"1px solid #86efac",borderRadius:10,padding:"9px 12px"}}>{authSuccess}</div>}
            <div style={{display:"flex",gap:10}}>
              <button type="submit" disabled={authLoading} style={{flex:1,background:INK,border:outline(),borderRadius:14,color:"#fff",fontFamily:HEAD,fontWeight:800,fontSize:14,padding:"13px",cursor:"pointer",boxShadow:drop(3,3),opacity:authLoading?.6:1}}>{authLoading?"…":"Log in →"}</button>
              <button type="button" onClick={()=>setLoginOpen(false)} style={{background:"transparent",border:`1px solid ${T.borderMid}`,borderRadius:14,color:T.muted,fontFamily:BODY,fontSize:14,padding:"13px 16px",cursor:"pointer"}}>Cancel</button>
            </div>
            <button type="button" onClick={sendRecovery} disabled={authLoading} style={{background:"none",border:"none",color:T.lav,fontFamily:BODY,fontSize:12,fontWeight:600,cursor:"pointer",padding:0,textAlign:"left"}}>Forgot password?</button>
          </form>
        </div>
      )}

      {/* Ignoring standby phrases asks first */}
      {ignoreAsk&&(()=>{
        const n=ignoreAsk==="all"?bulkRows.length:bulkRows.filter(r=>!r.keep).length;
        return (
          <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.35)",zIndex:130,display:"flex",alignItems:"center",justifyContent:"center",padding:24}} onClick={()=>setIgnoreAsk(null)}>
            <div onClick={e=>e.stopPropagation()} style={{background:T.surface,border:`1px solid ${T.borderMid}`,borderRadius:20,padding:24,maxWidth:310,width:"100%",animation:"pop .2s ease",boxShadow:"0 20px 60px rgba(0,0,0,.15)"}}>
              <div style={{fontSize:17,fontWeight:800,fontFamily:HEAD,marginBottom:6,color:T.ink}}>Ignore {n} phrase{n===1?"":"s"}?</div>
              <div style={{fontSize:12,color:T.muted,fontFamily:BODY,marginBottom:20,lineHeight:1.5}}>{ignoreAsk==="all"?"Everything on standby":"The unticked ones"} will be dropped and never added to the library. You can't get them back.</div>
              <div style={{display:"flex",gap:9}}>
                <button onClick={()=>ignoreStandby(ignoreAsk)} style={{flex:1,background:"#fee2e2",border:"1px solid #fca5a5",borderRadius:12,color:"#dc2626",padding:"11px",cursor:"pointer",fontFamily:HEAD,fontWeight:700,fontSize:13}}>Ignore</button>
                <button onClick={()=>setIgnoreAsk(null)} style={{flex:1,background:T.surfaceHi,border:`1px solid ${T.border}`,borderRadius:12,color:T.muted,padding:"11px",cursor:"pointer",fontFamily:BODY,fontSize:13}}>Keep them</button>
              </div>
            </div>
          </div>
        );
      })()}

      {/* Delete modal */}
      {delConfirm&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.35)",zIndex:100,display:"flex",alignItems:"center",justifyContent:"center",padding:24}} onClick={()=>setDelConfirm(null)}>
          <div onClick={e=>e.stopPropagation()} style={{background:T.surface,border:`1px solid ${T.borderMid}`,borderRadius:20,padding:24,maxWidth:290,width:"100%",animation:"pop .2s ease",boxShadow:"0 20px 60px rgba(0,0,0,.15)"}}>
            <div style={{fontSize:17,fontWeight:800,fontFamily:HEAD,marginBottom:6,color:T.ink}}>Delete phrase?</div>
            <div style={{fontSize:12,color:T.muted,fontFamily:BODY,marginBottom:20}}>Removed permanently from your cloud account.</div>
            <div style={{display:"flex",gap:9}}>
              <button onClick={()=>deletePhrase(delConfirm)} style={{flex:1,background:"#fee2e2",border:"1px solid #fca5a5",borderRadius:12,color:"#dc2626",padding:"11px",cursor:"pointer",fontFamily:HEAD,fontWeight:700,fontSize:13}}>Delete</button>
              <button onClick={()=>setDelConfirm(null)} style={{flex:1,background:T.surfaceHi,border:`1px solid ${T.border}`,borderRadius:12,color:T.muted,padding:"11px",cursor:"pointer",fontFamily:BODY,fontSize:13}}>Cancel</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<BiliG/>);
</script>
</body>
</html>
